<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSEB कक्षा 12 भौतिक विज्ञान प्रश्न बैंक</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; color: #333; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .header h1 { color: #2c3e50; font-size: 22px; }
        .controls { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        select, input { padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-size: 15px; flex: 1; min-width: 200px; outline: none; }
        select:focus, input:focus { border-color: #3498db; }
        .question-list { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .question-item { border-bottom: 1px dashed #ccc; padding-bottom: 12px; line-height: 1.6; font-size: 16px; }
        .q-text { font-weight: 600; color: #2c3e50; }
        .a-text { color: #e74c3c; font-weight: 600; }
        .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 5px; font-weight: bold; }
        .Simple { background-color: #2ecc71; }
        .Moderate { background-color: #f39c12; }
        .Hard { background-color: #e74c3c; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 20px; }
        .page-btn { padding: 8px 15px; background-color: #3498db; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .page-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>कक्षा 12 भौतिक विज्ञान मास्टर क्विज़ (BSEB)</h1>
            <p>सरल, मध्यम और कठिन प्रश्न</p>
        </div>

        <div class="controls">
            <select id="chapterFilter">
                <option value="all">सभी अध्याय</option>
                <option value="1">1. स्थिर विद्युत (Electrostatics)</option>
                <option value="2">2. धारा विद्युत (Current Electricity)</option>
                <option value="3">3. चुंबकीय प्रभाव और चुंबकत्व</option>
                <option value="4">4. विद्युत चुम्बकीय प्रेरण और प्रत्यावर्ती धारा</option>
                <option value="5">5. विद्युत चुम्बकीय तरंगें</option>
                <option value="6">6. प्रकाशिकी (Optics)</option>
                <option value="7">7. विकिरण की द्वैत प्रकृति</option>
                <option value="8">8. परमाणु और नाभिक</option>
                <option value="9">9. इलेक्ट्रॉनिक युक्तियाँ</option>
                <option value="10">10. संचार व्यवस्था</option>
            </select>
            
            <select id="difficultyFilter">
                <option value="all">सभी कठिनाई स्तर</option>
                <option value="Simple">सरल</option>
                <option value="Moderate">मध्यम</option>
                <option value="Hard">कठिन</option>
            </select>

            <input type="text" id="searchInput" placeholder="प्रश्न खोजें...">
        </div>

        <div class="question-list" id="questionContainer"></div>

        <div class="pagination">
            <button class="page-btn" id="prevBtn" onclick="changePage(-1)">पिछला</button>
            <span id="pageInfo">पृष्ठ 1 / 1</span>
            <button class="page-btn" id="nextBtn" onclick="changePage(1)">अगला</button>
        </div>
    </div>

    <script>
        // हिंदी में अनुवादित डेटासेट
        const physicsData = [
  { ch: "1", diff: "Simple", q: "विद्युत आवेश का SI मात्रक क्या है?", a: "कूलॉम (C)" },
  { ch: "1", diff: "Simple", q: "एक इलेक्ट्रॉन पर आवेश का मान क्या है?", a: "-1.6 × 10⁻¹⁹ C" },
  { ch: "1", diff: "Simple", q: "कूलॉम का नियम बताइए।", a: "F = k(q1*q2)/r²" },
  { ch: "1", diff: "Simple", q: "आवेश का क्वांटीकरण क्या है?", a: "Q = ±ne" },
  { ch: "1", diff: "Simple", q: "समान आवेशों के बीच बल की प्रकृति क्या है?", a: "प्रतिकर्षण (Repulsive)" },
  { ch: "1", diff: "Simple", q: "विद्युत विभव का SI मात्रक क्या है?", a: "वोल्ट (V)" },
  { ch: "1", diff: "Simple", q: "धारिता का SI मात्रक क्या है?", a: "फैराड (F)" },
  { ch: "1", diff: "Simple", q: "1 कूलॉम को परिभाषित करें।", a: "वह आवेश जो 1 मीटर की दूरी पर समान आवेश पर 9×10⁹ N का बल लगाता है।" },
  { ch: "1", diff: "Simple", q: "निर्वात में k का मान क्या है?", a: "9 × 10⁹ N·m²/C²" },
  { ch: "1", diff: "Simple", q: "परावैद्युत (Dielectric) क्या है?", a: "संधारित्र की प्लेटों के बीच रखा जाने वाला एक विद्युतरोधी पदार्थ।" },
  { ch: "1", diff: "Simple", q: "विद्युत क्षेत्र का सूत्र लिखिए।", a: "E = F/q" },
  { ch: "1", diff: "Simple", q: "विद्युत क्षेत्र एक अदिश या सदिश राशि है?", a: "सदिश (Vector)" },
  { ch: "1", diff: "Simple", q: "विद्युत फ्लक्स का SI मात्रक क्या है?", a: "N·m²/C या V·m" },
  { ch: "1", diff: "Simple", q: "समविभव पृष्ठ (Equipotential surface) क्या है?", a: "वह पृष्ठ जिसके प्रत्येक बिंदु पर विभव समान होता है।" },
  { ch: "1", diff: "Simple", q: "एक गोलीय चालक की धारिता क्या है?", a: "C = 4πε₀R" },
  { ch: "1", diff: "Simple", q: "कूलॉम के नियम का सदिश रूप क्या है?", a: "F = k q₁q₂ r̂ / r² (= k q₁q₂ r⃗ / r³)" },
  { ch: "1", diff: "Simple", q: "विद्युत बलों के अध्यारोपण का सिद्धांत बताइए।", a: "कुल बल व्यक्तिगत बलों का सदिश योग होता है।" },
  { ch: "1", diff: "Simple", q: "सतत आवेश वितरण क्या है?", a: "किसी रेखा, पृष्ठ या आयतन पर लगातार वितरित आवेश।" },
  { ch: "1", diff: "Simple", q: "रैखिक आवेश घनत्व का सूत्र क्या है?", a: "λ = q/L" },
  { ch: "1", diff: "Simple", q: "पृष्ठ आवेश घनत्व का सूत्र क्या है?", a: "σ = q/A" },
  { ch: "1", diff: "Simple", q: "आयतन आवेश घनत्व का सूत्र क्या है?", a: "ρ = q/V" },
  { ch: "1", diff: "Simple", q: "पृष्ठ आवेश घनत्व का SI मात्रक क्या है?", a: "कूलॉम प्रति वर्ग मीटर (C/m²)" },
  { ch: "1", diff: "Simple", q: "घर्षण द्वारा किसी वस्तु को आवेशित कैसे किया जाता है?", a: "दो अलग-अलग पदार्थों को रगड़ने से इलेक्ट्रॉन एक से दूसरे में स्थानांतरित होते हैं।" },
  { ch: "1", diff: "Simple", q: "प्रेरण द्वारा आवेशित करना क्या है?", a: "बिना सीधे संपर्क के उदासीन चालक को आवेशित करना।" },
  { ch: "1", diff: "Simple", q: "बिंदु आवेश (Point charge) क्या है?", a: "वह आवेश जिसके आयाम अन्य आवेशों की दूरी की तुलना में नगण्य होते हैं।" },
  { ch: "1", diff: "Simple", q: "क्या विद्युत क्षेत्र परीक्षण आवेश के परिमाण पर निर्भर करता है?", a: "नहीं, E = F/q, यह परीक्षण आवेश से स्वतंत्र होता है।" },
  { ch: "1", diff: "Simple", q: "आवेशित चालक के अंदर विद्युत क्षेत्र क्या होता है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Simple", q: "ऋणात्मक बिंदु आवेश के कारण विद्युत क्षेत्र की दिशा क्या होती है?", a: "रेडियल रूप से अंदर की ओर (Radially inward)" },
  { ch: "1", diff: "Simple", q: "द्विध्रुव के केंद्र पर विद्युत क्षेत्र क्या होता है?", a: "केंद्र पर इसकी परिभाषा नहीं होती, लेकिन ठीक बाहर यह द्विध्रुव आघूर्ण के विपरीत होता है।" },
  { ch: "1", diff: "Simple", q: "द्विध्रुव की निरक्षीय रेखा (Equatorial line) पर विभव क्या होता है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Simple", q: "समविभव पृष्ठ के साथ आवेश को स्थानांतरित करने में किया गया कार्य क्या होता है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Simple", q: "क्या दो समविभव पृष्ठ एक दूसरे को काट सकते हैं?", a: "नहीं, क्योंकि इसका मतलब है कि एक ही बिंदु पर दो विभव मान हो सकते हैं।" },
  { ch: "1", diff: "Simple", q: "एकसमान विद्युत क्षेत्र के लिए समविभव पृष्ठ का आकार क्या होता है?", a: "क्षेत्र के लंबवत समतल (Planes)।" },
  { ch: "1", diff: "Simple", q: "बिंदु आवेश के लिए समविभव पृष्ठ का आकार क्या है?", a: "संकेंद्री गोले (Concentric spheres)।" },
  { ch: "1", diff: "Simple", q: "इलेक्ट्रॉन-वोल्ट और जूल के बीच क्या संबंध है?", a: "1 eV = 1.6 × 10⁻¹⁹ J" },
  { ch: "1", diff: "Simple", q: "1 वोल्ट को परिभाषित करें।", a: "वह विभवांतर जब 1 C आवेश को स्थानांतरित करने में 1 J कार्य किया जाता है।" },
  { ch: "1", diff: "Simple", q: "प्रोटॉन का द्रव्यमान क्या है?", a: "1.67 × 10⁻²⁷ kg" },
  { ch: "1", diff: "Simple", q: "इलेक्ट्रॉन का द्रव्यमान क्या है?", a: "9.1 × 10⁻³¹ kg" },
  { ch: "1", diff: "Simple", q: "आवेश संरक्षण का नियम बताइए।", a: "एक पृथक प्रणाली का कुल आवेश स्थिर रहता है।" },
  { ch: "1", diff: "Simple", q: "निर्वात का परावैद्युतांक (Dielectric constant) कितना होता है?", a: "1" },
  { ch: "1", diff: "Simple", q: "परीक्षण आवेश (Test charge) क्या है?", a: "विद्युत क्षेत्र को बाधित किए बिना मापने के लिए उपयोग किया जाने वाला छोटा धनात्मक आवेश।" },
  { ch: "1", diff: "Simple", q: "विद्युत द्विध्रुव आघूर्ण का SI मात्रक क्या है?", a: "कूलॉम-मीटर (C·m)" },
  { ch: "1", diff: "Simple", q: "समांतर प्लेट संधारित्र की धारिता का सूत्र क्या है?", a: "C = ε₀A/d" },
  { ch: "1", diff: "Simple", q: "समांतर क्रम में संधारित्रों की समतुल्य धारिता क्या होती है?", a: "Cp = C1 + C2 + C3" },
  { ch: "1", diff: "Simple", q: "श्रेणी क्रम में संधारित्रों की समतुल्य धारिता क्या होती है?", a: "1/Cs = 1/C1 + 1/C2 + 1/C3" },
  { ch: "1", diff: "Simple", q: "विद्युत फ्लक्स घनत्व (D) का मात्रक क्या है?", a: "कूलॉम प्रति वर्ग मीटर (C/m²)" },
  { ch: "1", diff: "Moderate", q: "द्विध्रुव को घेरने वाले बंद पृष्ठ के माध्यम से कुल फ्लक्स क्या होता है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Moderate", q: "विद्युत द्विध्रुव आघूर्ण को परिभाषित करें।", a: "p = q × 2a (दिशा: -q से +q तक)" },
  { ch: "1", diff: "Moderate", q: "गॉस का नियम बताइए।", a: "फ्लक्स = 1/ε₀ × (संलग्न शुद्ध आवेश)" },
  { ch: "1", diff: "Moderate", q: "यदि परावैद्युत डाला जाता है तो धारिता का क्या होता है?", a: "यह K गुना बढ़ जाती है।" },
  { ch: "1", diff: "Moderate", q: "1 फैराड को परिभाषित करें।", a: "वह धारिता जब 1 C आवेश विभव को 1 V तक बढ़ाता है।" },
  { ch: "1", diff: "Moderate", q: "E और V के बीच क्या संबंध है?", a: "E = -dV/dx" },
  { ch: "1", diff: "Moderate", q: "वोल्टमीटर को समांतर क्रम में क्यों जोड़ा जाता है?", a: "इसमें उच्च प्रतिरोध होता है और यह विभवांतर मापता है।" },
  { ch: "1", diff: "Moderate", q: "आवेशित खोखले गोले के अंदर विद्युत क्षेत्र क्या होता है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Moderate", q: "संधारित्र में संचित ऊर्जा का सूत्र लिखिए।", a: "U = 1/2 CV²" },
  { ch: "1", diff: "Moderate", q: "E और D (विस्थापन सदिश) के बीच क्या संबंध है?", a: "D = ε₀E + P" },
  { ch: "1", diff: "Moderate", q: "दो समांतर अनंत रेखीय आवेशों के बीच प्रति इकाई लंबाई पर बल क्या है?", a: "F = λ1λ2 / (2πε₀r)" },
  { ch: "1", diff: "Moderate", q: "बिंदु आवेश से r दूरी पर विद्युत विभव क्या है?", a: "V = kq/r" },
  { ch: "1", diff: "Moderate", q: "अक्षीय स्थिति (Axial position) पर द्विध्रुव का विद्युत क्षेत्र क्या है?", a: "E = 2kp/r³" },
  { ch: "1", diff: "Moderate", q: "निरक्षीय स्थिति (Equatorial position) पर द्विध्रुव का विद्युत क्षेत्र क्या है?", a: "E = kp/r³" },
  { ch: "1", diff: "Moderate", q: "एकसमान क्षेत्र में द्विध्रुव पर बलाघूर्ण (Torque) क्या है?", a: "τ = pE sinθ" },
  { ch: "1", diff: "Moderate", q: "समविभव पृष्ठ पर आवेश को स्थानांतरित करने में किया गया कार्य क्या है?", a: "शून्य (Zero)" },
  { ch: "1", diff: "Moderate", q: "श्रेणी क्रम में समतुल्य धारिता के लिए व्यंजक लिखिए।", a: "1/Cs = 1/C1 + 1/C2" },
  { ch: "1", diff: "Moderate", q: "खोखले चालक के अंदर विद्युत क्षेत्र शून्य क्यों होता है?", a: "क्योंकि आवेश बाहरी सतह पर रहते हैं, जिससे अंदर का क्षेत्र रद्द हो जाता है।" },
  { ch: "1", diff: "Moderate", q: "स्थिर विद्युत परिरक्षण (Electrostatic shielding) क्या है?", a: "खोखले चालक का उपयोग करके किसी क्षेत्र को बाहरी विद्युत क्षेत्रों से बचाना।" },
  { ch: "1", diff: "Moderate", q: "आवेश की अनंत समतल चादर के कारण विद्युत क्षेत्र क्या है?", a: "E = σ / (2ε₀)" },
  { ch: "1", diff: "Moderate", q: "एकसमान रूप से आवेशित पतले गोलीय खोल के बाहर किसी बिंदु पर विद्युत क्षेत्र क्या है?", a: "E = kQ/r² (ऐसे व्यवहार करता है जैसे आवेश केंद्र पर हो)।" },
  { ch: "1", diff: "Moderate", q: "द्विध्रुव को स्थिर से अस्थिर साम्यावस्था में घुमाने में किया गया कार्य क्या है?", a: "W = 2pE" },
  { ch: "1", diff: "Moderate", q: "दो आवेशों के निकाय की स्थितिज ऊर्जा क्या है?", a: "U = k(q1q2)/r" },
  { ch: "1", diff: "Moderate", q: "यदि प्लेटों के बीच धातु की स्लैब डाली जाए तो धारिता का क्या होता है?", a: "धारिता बढ़ जाती है।" },

        // JS Logic
        const container = document.getElementById('questionContainer');
        const chapterFilter = document.getElementById('chapterFilter');
        const difficultyFilter = document.getElementById('difficultyFilter');
        const searchInput = document.getElementById('searchInput');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');

        let currentPage = 1;
        const itemsPerPage = 100;
        let filteredData = [...physicsData];

        function updateUI() {
            const selectedChapter = chapterFilter.value;
            const selectedDifficulty = difficultyFilter.value;
            const searchText = searchInput.value.toLowerCase();

            filteredData = physicsData.filter(item => {
                const matchChapter = selectedChapter === 'all' || item.ch === selectedChapter;
                const matchDifficulty = selectedDifficulty === 'all' || item.diff === selectedDifficulty;
                const matchSearch = item.q.toLowerCase().includes(searchText) || item.a.toLowerCase().includes(searchText);
                return matchChapter && matchDifficulty && matchSearch;
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            container.innerHTML = '';
            if (paginatedData.length === 0) {
                container.innerHTML = '<p style="text-align:center;">कोई प्रश्न नहीं मिला।</p>';
            } else {
                paginatedData.forEach((item, index) => {
                    const globalIndex = startIndex + index + 1;
                    const div = document.createElement('div');
                    div.className = 'question-item';
                    
                    // Translate difficulty label for display
                    let diffLabel = item.diff;
                    if(item.diff === 'Simple') diffLabel = 'सरल';
                    if(item.diff === 'Moderate') diffLabel = 'मध्यम';
                    if(item.diff === 'Hard') diffLabel = 'कठिन';

                    div.innerHTML = `
                        <div style="margin-bottom: 5px;">
                            <span class="badge ${item.diff}">${diffLabel}</span>
                            <span class="q-text">प्रश्न ${globalIndex}: ${item.q}</span>
                        </div>
                        <div>
                            <span class="a-text">उत्तर: ${item.a}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            pageInfo.textContent = `पृष्ठ ${currentPage} / ${totalPages} (कुल: ${filteredData.length} प्रश्न)`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        chapterFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        difficultyFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        searchInput.addEventListener('input', () => { currentPage = 1; updateUI(); });

        updateUI();
    </script>
