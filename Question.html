  { ch: "8", diff: "Moderate", q: "What is the principle of carbon dating?", a: "The ratio of ¹⁴C to ¹²C decreases after death because of radioactive decay of ¹⁴C." },
  { ch: "8", diff: "Hard", q: "What is the impact parameter?", a: "Perpendicular distance of alpha particle from nucleus." },
  { ch: "8", diff: "Hard", q: "What is the relation between impact parameter and scattering angle?", a: "b ∝ cot(θ/2)." },
  { ch: "8", diff: "Hard", q: "What is the average life of a radioactive substance?", a: "τ = 1/λ." },
  { ch: "8", diff: "Hard", q: "What is the Q-value of a nuclear reaction?", a: "Q = (Initial mass - Final mass)c²." },
  { ch: "8", diff: "Hard", q: "What is the energy released per fission of U-235?", a: "~200 MeV." },
  { ch: "8", diff: "Hard", q: "Why is heavy water used as a moderator?", a: "It slows neutrons without absorbing them." },
  { ch: "8", diff: "Hard", q: "Derive N = N₀e^(−λt).", a: "dN/dt = −λN gives ln N = −λt + constant, so N = N₀e^(−λt)." },
  { ch: "8", diff: "Hard", q: "Derive T₁/₂ = 0.693/λ.", a: "Put N = N₀/2: ln 2 = λT₁/₂, so T₁/₂ = 0.693/λ." },
  { ch: "8", diff: "Hard", q: "Find the binding energy of ⁴He given mass 4.0015 u.", a: "Δm = 2(1.0073) + 2(1.0087) − 4.0015 = 0.0305 u, so BE ≈ 28.4 MeV." },
  { ch: "8", diff: "Hard", q: "A 200 MW reactor releases 200 MeV per fission. Find fissions per second.", a: "N = 2 × 10⁸/(3.2 × 10⁻¹¹) ≈ 6.25 × 10¹⁸." },
  { ch: "8", diff: "Hard", q: "Find the distance of closest approach for a 5 MeV α-particle on gold (Z = 79).", a: "d = 2kZe²/K ≈ 4.5 × 10⁻¹⁴ m." },
  { ch: "8", diff: "Hard", q: "What is the scattering angle for zero impact parameter?", a: "180° (head-on, retraced path)." },
  { ch: "8", diff: "Hard", q: "Find the ground-state energy of He⁺.", a: "−13.6 × 4 = −54.4 eV." },
  { ch: "8", diff: "Hard", q: "Find the ionisation energy of Li²⁺.", a: "13.6 × 9 = 122.4 eV." },
  { ch: "8", diff: "Hard", q: "Find the photon energy for the n = 4 to n = 1 transition in hydrogen.", a: "12.75 eV." },
  { ch: "8", diff: "Hard", q: "Find the ratio of radii of the n = 3 and n = 1 Bohr orbits.", a: "9 : 1." },
  { ch: "8", diff: "Hard", q: "How does the frequency of revolution in the nth Bohr orbit depend on n?", a: "It is proportional to 1/n³." },
  { ch: "8", diff: "Hard", q: "How does the time period of revolution depend on n?", a: "It is proportional to n³." },
  { ch: "8", diff: "Hard", q: "Why do heavy nuclei have more neutrons than protons?", a: "Extra neutrons add attractive nuclear force without Coulomb repulsion, giving stability." },
  { ch: "8", diff: "Hard", q: "Why is the n = 1 level of hydrogen stable?", a: "It is the lowest energy level, so no lower state is available to drop to." },
  { ch: "8", diff: "Hard", q: "Explain the stability of the nucleus in terms of binding energy per nucleon.", a: "Nuclei with higher BE per nucleon are more stable; the maximum is near A = 56." },
  { ch: "9", diff: "Simple", q: "Energy gap of Silicon?", a: "1.1 eV" },
  { ch: "9", diff: "Simple", q: "Majority carriers in P-type?", a: "Holes" },
  { ch: "9", diff: "Simple", q: "Majority carriers in N-type?", a: "Electrons" },
  { ch: "9", diff: "Simple", q: "What does LED stand for?", a: "Light Emitting Diode." },
  { ch: "9", diff: "Simple", q: "What is doping?", a: "Adding impurities to semiconductors." },
  { ch: "9", diff: "Simple", q: "What is the output of NAND for (1,1)?", a: "0" },
  { ch: "9", diff: "Simple", q: "Which biasing acts as a closed switch?", a: "Forward bias." },
  { ch: "9", diff: "Simple", q: "Boolean equation for NOT gate?", a: "Y = A'" },
  { ch: "9", diff: "Simple", q: "Boolean equation for AND gate?", a: "Y = A.B" },
  { ch: "9", diff: "Simple", q: "Boolean equation for OR gate?", a: "Y = A+B" },
  { ch: "9", diff: "Simple", q: "What is a logic gate?", a: "Digital circuit performing Boolean operations." },
  { ch: "9", diff: "Simple", q: "What is a rectifier?", a: "Converts AC to DC." },
  { ch: "9", diff: "Simple", q: "Which diode is used for voltage regulation?", a: "Zener diode." },
  { ch: "9", diff: "Simple", q: "Energy gap of Germanium?", a: "0.7 eV" },
  { ch: "9", diff: "Simple", q: "What is an intrinsic semiconductor?", a: "Pure semiconductor." },
  { ch: "9", diff: "Simple", q: "What is the forbidden energy gap?", a: "The energy difference between the top of the valence band and the bottom of the conduction band." },
  { ch: "9", diff: "Simple", q: "What is the valence band?", a: "The highest energy band filled with electrons." },
  { ch: "9", diff: "Simple", q: "What is the conduction band?", a: "The band above the gap in which electrons are free to conduct." },
  { ch: "9", diff: "Simple", q: "What is the energy gap of a conductor?", a: "Zero; the bands overlap." },
  { ch: "9", diff: "Simple", q: "What is the energy gap of an insulator?", a: "Greater than about 3 eV." },
  { ch: "9", diff: "Simple", q: "What is a hole?", a: "A vacancy of electron in the valence band that behaves as a positive charge carrier." },
  { ch: "9", diff: "Simple", q: "Does a pure semiconductor conduct at 0 K?", a: "No, it behaves as an insulator." },
  { ch: "9", diff: "Simple", q: "What is the net charge on an n-type semiconductor?", a: "Zero." },
  { ch: "9", diff: "Simple", q: "What impurities are used for n-type doping?", a: "Arsenic, phosphorus and antimony." },
  { ch: "9", diff: "Simple", q: "What impurities are used for p-type doping?", a: "Boron, aluminium, indium and gallium." },
  { ch: "9", diff: "Simple", q: "What is diffusion current?", a: "Current due to carriers moving from a region of high concentration to low concentration." },
  { ch: "9", diff: "Simple", q: "What is drift current?", a: "Current due to carriers moving under an electric field." },
  { ch: "9", diff: "Simple", q: "What is reverse saturation current?", a: "The small current (μA) due to minority carriers in reverse bias." },
  { ch: "9", diff: "Simple", q: "What is breakdown voltage?", a: "The reverse voltage at which the current suddenly increases sharply." },
  { ch: "9", diff: "Simple", q: "What is the knee voltage of a germanium diode?", a: "About 0.3 V." },
  { ch: "9", diff: "Simple", q: "Where is an IR LED used?", a: "In remote controls to transmit signals." },
  { ch: "9", diff: "Simple", q: "Name some semiconductor compounds.", a: "GaAs, CdS and InP." },
  { ch: "9", diff: "Simple", q: "Name common materials for solar cells.", a: "Silicon, gallium arsenide and cadmium sulphide." },
  { ch: "9", diff: "Moderate", q: "Why is a PN junction a rectifier?", a: "It conducts in one direction." },
  { ch: "9", diff: "Moderate", q: "What is the depletion region?", a: "Region without mobile charge carriers." },
  { ch: "9", diff: "Moderate", q: "Difference between Zener and Avalanche?", a: "Zener: high field; Avalanche: collision." },
  { ch: "9", diff: "Moderate", q: "How does a transistor act as an amplifier?", a: "Small base current controls large collector current." },
  { ch: "9", diff: "Moderate", q: "Relation between α and β?", a: "β = α/(1-α)" },
  { ch: "9", diff: "Moderate", q: "What is a full-wave rectifier?", a: "Converts both half-cycles to DC." },
  { ch: "9", diff: "Moderate", q: "What are intrinsic and extrinsic semiconductors?", a: "Intrinsic: pure; Extrinsic: doped." },
  { ch: "9", diff: "Moderate", q: "What is a photodiode?", a: "Conducts when light falls (reverse bias)." },
  { ch: "9", diff: "Moderate", q: "What is the output of NOR for (0,0)?", a: "1" },
  { ch: "9", diff: "Moderate", q: "What is the output of XOR for (1,0)?", a: "1" },
  { ch: "9", diff: "Moderate", q: "What is the output of XOR for (1,1)?", a: "0" },
  { ch: "9", diff: "Moderate", q: "What is the principle of a transistor?", a: "Transfer of resistance." },
  { ch: "9", diff: "Moderate", q: "Which transistor configuration has highest voltage gain?", a: "Common Emitter (CE)." },
  { ch: "9", diff: "Moderate", q: "Which transistor configuration has highest input impedance?", a: "Common Collector (CC)." },
  { ch: "9", diff: "Moderate", q: "Write the conductivity of an intrinsic semiconductor.", a: "σ = e(neμe + nhμh)." },
  { ch: "9", diff: "Moderate", q: "What is the relation between electron and hole densities in an intrinsic semiconductor?", a: "ne = nh = ni." },
  { ch: "9", diff: "Moderate", q: "State the law of mass action for semiconductors.", a: "ne nh = ni²." },
  { ch: "9", diff: "Moderate", q: "How does temperature affect n-type conductivity at high temperature?", a: "It increases because of thermal generation of electron-hole pairs." },
  { ch: "9", diff: "Moderate", q: "What is the typical width of the depletion region?", a: "About 10⁻⁶ m." },
  { ch: "9", diff: "Moderate", q: "What is the typical electric field across the depletion region?", a: "About 10⁶ V/m." },
  { ch: "9", diff: "Moderate", q: "Define the dynamic resistance of a diode.", a: "rd = ΔV/ΔI at a given operating point." },
  { ch: "9", diff: "Moderate", q: "What is the DC output of a half-wave rectifier?", a: "Idc = I₀/π." },
  { ch: "9", diff: "Moderate", q: "What is the rms value of the current for a half-wave rectifier?", a: "I₀/2." },
  { ch: "9", diff: "Moderate", q: "What is the DC output of a full-wave rectifier?", a: "Idc = 2I₀/π." },
  { ch: "9", diff: "Moderate", q: "Why is a filter capacitor connected in parallel with the load?", a: "It bypasses the AC ripple and smooths the output." },
  { ch: "9", diff: "Moderate", q: "Why is a series resistor used with a Zener diode?", a: "It limits the current and drops the excess voltage." },
  { ch: "9", diff: "Moderate", q: "A Zener of 6 V is fed from 12 V through 100 Ω with no load. Find the current.", a: "(12 − 6)/100 = 60 mA." },
  { ch: "9", diff: "Moderate", q: "The same Zener circuit has a 200 Ω load. Find the load and Zener currents.", a: "Load current 30 mA; Zener current 30 mA." },
  { ch: "9", diff: "Moderate", q: "A transistor has Ib = 20 μA and β = 100. Find Ic.", a: "2 mA." },
  { ch: "9", diff: "Moderate", q: "Find β when α = 0.98.", a: "49." },
  { ch: "9", diff: "Moderate", q: "Find α when β = 100.", a: "0.99." },
  { ch: "9", diff: "Moderate", q: "Find Ie when Ib = 0.1 mA and Ic = 5 mA.", a: "5.1 mA." },
  { ch: "9", diff: "Moderate", q: "A CE amplifier has β = 50, RL = 4 kΩ and Rin = 1 kΩ. Find the voltage gain.", a: "Av = βRL/Rin = 200." },
  { ch: "9", diff: "Moderate", q: "Find the power gain for the same amplifier.", a: "β²RL/Rin = 10⁴." },
  { ch: "9", diff: "Moderate", q: "What is the cut-off region of a transistor?", a: "Both junctions are reverse biased; the transistor is OFF." },
  { ch: "9", diff: "Moderate", q: "What is the active region of a transistor?", a: "Emitter–base forward biased and collector–base reverse biased." },
  { ch: "9", diff: "Moderate", q: "What is the saturation region?", a: "Both junctions are forward biased; the transistor acts as a closed switch." },
  { ch: "9", diff: "Moderate", q: "Write the truth table of an AND gate.", a: "00→0, 01→0, 10→0, 11→1." },
  { ch: "9", diff: "Moderate", q: "How is a NOT gate made from a NAND gate?", a: "Join both inputs together." },
  { ch: "9", diff: "Moderate", q: "State De Morgan's first theorem.", a: "(A + B)' = A'·B'." },
  { ch: "9", diff: "Moderate", q: "State De Morgan's second theorem.", a: "(A·B)' = A' + B'." },
  { ch: "9", diff: "Moderate", q: "Write the Boolean expression of an XOR gate.", a: "Y = A'B + AB'." },
  { ch: "9", diff: "Hard", q: "What is the barrier potential of Si?", a: "0.7 V" },
  { ch: "9", diff: "Hard", q: "What is the barrier potential of Ge?", a: "0.3 V" },
  { ch: "9", diff: "Hard", q: "What are the factors affecting barrier potential?", a: "Temperature and doping." },
  { ch: "9", diff: "Hard", q: "Explain Avalanche breakdown.", a: "Collision of charge carriers creates more pairs." },
  { ch: "9", diff: "Hard", q: "Explain Zener breakdown.", a: "High electric field breaks covalent bonds." },
  { ch: "9", diff: "Hard", q: "What is the current gain formula for CE?", a: "β = Ic/Ib" },
  { ch: "9", diff: "Hard", q: "What is the current gain formula for CB?", a: "α = Ic/Ie" },
  { ch: "9", diff: "Hard", q: "What is the output of a NAND gate when both inputs are A?", a: "Y = (A·A)' = A', so it acts as a NOT gate." },
  { ch: "9", diff: "Hard", q: "How is an AND gate built from NOR gates?", a: "Invert both inputs with NOR gates and feed them into another NOR: (A' + B')' = AB." },
  { ch: "9", diff: "Hard", q: "Simplify A + AB.", a: "A." },
  { ch: "9", diff: "Hard", q: "Write the truth table of XNOR.", a: "00→1, 01→0, 10→0, 11→1." },
  { ch: "9", diff: "Hard", q: "Find the minimum base current to saturate a transistor with VCC = 10 V, RC = 1 kΩ and β = 100.", a: "Ic(sat) = 10 mA, so Ib ≥ 0.1 mA." },
  { ch: "9", diff: "Hard", q: "In a CE circuit VCC = 12 V, RC = 2 kΩ and Ic = 3 mA. Find VCE.", a: "VCE = 12 − 6 = 6 V." },
  { ch: "9", diff: "Hard", q: "Find the ripple factor of a full-wave rectifier without filter.", a: "0.48." },
  { ch: "9", diff: "Hard", q: "Find the longest wavelength that can create an electron-hole pair in silicon (Eg = 1.1 eV).", a: "λ = 12400/1.1 ≈ 11270 Å." },
  { ch: "9", diff: "Hard", q: "An LED emits at 620 nm. Find its band gap.", a: "Eg ≈ 2.0 eV." },
  { ch: "9", diff: "Hard", q: "A solar cell has VOC = 0.6 V, ISC = 2 A and fill factor 0.7. Find the maximum power.", a: "0.6 × 2 × 0.7 = 0.84 W." },
  { ch: "9", diff: "Hard", q: "Why does the depletion region widen in reverse bias?", a: "More fixed ions are uncovered as carriers are pulled away from the junction." },
  { ch: "9", diff: "Hard", q: "Write the diode current equation.", a: "I = I₀(e^(eV/kT) − 1)." },
  { ch: "9", diff: "Hard", q: "Why is the base current in a transistor small?", a: "The base is thin and lightly doped, so few carriers recombine there." },
  { ch: "9", diff: "Hard", q: "What is thermal runaway?", a: "A rise in temperature increases current, which produces more heat and further increases the current." },
  { ch: "9", diff: "Hard", q: "Explain the working of an n-p-n transistor.", a: "Emitter electrons cross the thin base; most reach the collector and about 2–5% recombine in the base, so Ie = Ib + Ic." },
  { ch: "9", diff: "Hard", q: "Draw the output wave for a half-wave rectifier in words.", a: "Only the positive half-cycles of the input appear at the output; negative half-cycles are blocked." },
  { ch: "10", diff: "Simple", q: "What is communication?", a: "The process of transmitting information from one place to another." },
  { ch: "10", diff: "Simple", q: "What are the three basic elements of a communication system?", a: "Transmitter, channel (medium) and receiver." },
  { ch: "10", diff: "Simple", q: "What is a transmitter?", a: "A device that converts the message signal into a form suitable for transmission." },
  { ch: "10", diff: "Simple", q: "What is a receiver?", a: "A device that extracts the original message from the received signal." },
  { ch: "10", diff: "Simple", q: "What is a channel?", a: "The physical medium through which the signal travels, such as a cable or free space." },
  { ch: "10", diff: "Simple", q: "What is a transducer?", a: "A device that converts one form of energy into another, e.g. a microphone." },
  { ch: "10", diff: "Simple", q: "What is bandwidth of a signal?", a: "The range of frequencies over which the signal is spread." },
  { ch: "10", diff: "Simple", q: "What is modulation?", a: "Superimposing a low-frequency message signal on a high-frequency carrier wave." },
  { ch: "10", diff: "Simple", q: "Why is modulation needed?", a: "To reduce antenna size, avoid mixing of signals and allow multiplexing." },
  { ch: "10", diff: "Simple", q: "Name the types of modulation.", a: "Amplitude, frequency and phase modulation." },
  { ch: "10", diff: "Simple", q: "What is amplitude modulation?", a: "The amplitude of the carrier is varied in accordance with the message signal." },
  { ch: "10", diff: "Simple", q: "What is frequency modulation?", a: "The frequency of the carrier is varied in accordance with the message signal." },
  { ch: "10", diff: "Simple", q: "What is the frequency range of audio signals?", a: "20 Hz to 20 kHz." },
  { ch: "10", diff: "Simple", q: "What is the frequency range of speech signals?", a: "300 Hz to 3100 Hz." },
  { ch: "10", diff: "Simple", q: "What is the bandwidth of a TV video signal?", a: "About 4.2 MHz." },
  { ch: "10", diff: "Simple", q: "What is ground wave propagation?", a: "Propagation of radio waves along the surface of the Earth." },
  { ch: "10", diff: "Simple", q: "What is sky wave propagation?", a: "Propagation by reflection of radio waves from the ionosphere." },
  { ch: "10", diff: "Simple", q: "What is space wave propagation?", a: "Propagation in a straight line between transmitting and receiving antennas (line of sight)." },
  { ch: "10", diff: "Simple", q: "Which propagation is used for long-distance short-wave radio?", a: "Sky wave propagation." },
  { ch: "10", diff: "Simple", q: "Which propagation is used for TV and satellite communication?", a: "Space wave propagation." },
  { ch: "10", diff: "Simple", q: "What is the ionosphere?", a: "The upper part of the atmosphere containing ionised gases, about 65–400 km above Earth." },
  { ch: "10", diff: "Simple", q: "What is a carrier wave?", a: "A high-frequency wave whose characteristic is varied to carry the message." },
  { ch: "10", diff: "Simple", q: "What is demodulation?", a: "The process of recovering the message signal from the modulated wave." },
  { ch: "10", diff: "Simple", q: "What is a repeater?", a: "A device that receives, amplifies and retransmits a signal to extend its range." },
  { ch: "10", diff: "Simple", q: "What is a modem?", a: "A device that modulates and demodulates data for transmission over telephone lines." },
  { ch: "10", diff: "Simple", q: "What is an antenna?", a: "A device used to radiate or receive electromagnetic waves." },
  { ch: "10", diff: "Simple", q: "What is a geostationary satellite?", a: "A satellite with an orbital period of 24 hours that appears fixed over one point of the equator." },
  { ch: "10", diff: "Simple", q: "What is the height of a geostationary orbit?", a: "About 36,000 km." },
  { ch: "10", diff: "Simple", q: "What is a transponder?", a: "A device in a satellite that receives, amplifies and retransmits signals." },
  { ch: "10", diff: "Simple", q: "What is noise?", a: "Unwanted signals that interfere with the message signal." },
  { ch: "10", diff: "Simple", q: "What is attenuation?", a: "Loss of signal strength as it travels through a medium." },
  { ch: "10", diff: "Simple", q: "What is an analog signal?", a: "A continuous signal that can take any value within a range." },
  { ch: "10", diff: "Simple", q: "What is a digital signal?", a: "A discrete signal that takes only two levels, 0 and 1." },
  { ch: "10", diff: "Simple", q: "What is multiplexing?", a: "Combining several signals for transmission over a single channel." },
  { ch: "10", diff: "Simple", q: "What is the internet?", a: "A worldwide network of interconnected computers." },
  { ch: "10", diff: "Simple", q: "What is a LAN?", a: "Local Area Network covering a small area like a building." },
  { ch: "10", diff: "Simple", q: "What is a WAN?", a: "Wide Area Network covering a large geographic area." },
  { ch: "10", diff: "Simple", q: "What is a facsimile (fax)?", a: "A system for transmitting scanned documents over telephone lines." },
  { ch: "10", diff: "Moderate", q: "Write the expression for an amplitude modulated wave.", a: "c(t) = (Ac + Am sin ωm t) sin ωc t." },
  { ch: "10", diff: "Moderate", q: "Define modulation index in AM.", a: "μ = Am/Ac." },
  { ch: "10", diff: "Moderate", q: "What is the maximum value of modulation index without distortion?", a: "1 (100%)." },
  { ch: "10", diff: "Moderate", q: "What is over-modulation?", a: "μ > 1, which causes distortion of the message." },
  { ch: "10", diff: "Moderate", q: "What is the bandwidth of an AM wave?", a: "2fm, twice the highest modulating frequency." },
  { ch: "10", diff: "Moderate", q: "What are the frequencies present in an AM wave?", a: "fc, fc + fm and fc − fm." },
  { ch: "10", diff: "Moderate", q: "What is the upper sideband frequency?", a: "fc + fm." },
  { ch: "10", diff: "Moderate", q: "What is the lower sideband frequency?", a: "fc − fm." },
  { ch: "10", diff: "Moderate", q: "Write the formula for the total power of an AM wave.", a: "Pt = Pc(1 + μ²/2)." },
  { ch: "10", diff: "Moderate", q: "What is the advantage of FM over AM?", a: "Better noise immunity and signal-to-noise ratio." },
  { ch: "10", diff: "Moderate", q: "What is the disadvantage of FM compared to AM?", a: "It needs a larger bandwidth." },
  { ch: "10", diff: "Moderate", q: "What is the range of a transmitting antenna of height h?", a: "d = √(2Rh), where R is the Earth's radius." },
  { ch: "10", diff: "Moderate", q: "What is the line-of-sight range between two antennas of heights ht and hr?", a: "d = √(2Rht) + √(2Rhr)." },
  { ch: "10", diff: "Moderate", q: "What is the effective antenna length for efficient radiation?", a: "About λ/4 or larger (comparable to the wavelength)." },
  { ch: "10", diff: "Moderate", q: "Why are high frequencies needed for transmission?", a: "Radiated power ∝ (l/λ)², so a high frequency gives efficient radiation with a short antenna." },
  { ch: "10", diff: "Moderate", q: "Why can sky waves not be used above about 30 MHz?", a: "Higher frequencies pass through the ionosphere instead of being reflected." },
  { ch: "10", diff: "Moderate", q: "What is the critical frequency?", a: "The maximum frequency reflected back from the ionosphere for vertical incidence." },
  { ch: "10", diff: "Moderate", q: "What is the skip distance?", a: "The shortest distance from the transmitter at which sky waves return to Earth." },
  { ch: "10", diff: "Moderate", q: "What is the radio horizon?", a: "The maximum line-of-sight distance from a transmitting antenna." },
  { ch: "10", diff: "Moderate", q: "What is the principle of RADAR?", a: "It transmits radio waves and detects their echo to find the distance and speed of an object." },
  { ch: "10", diff: "Moderate", q: "What is the bandwidth of a telephone signal?", a: "About 3 kHz." },
  { ch: "10", diff: "Moderate", q: "What is FDM?", a: "Frequency Division Multiplexing: signals share a channel by occupying different frequency bands." },
  { ch: "10", diff: "Moderate", q: "What is TDM?", a: "Time Division Multiplexing: signals share a channel by using different time slots." },
  { ch: "10", diff: "Moderate", q: "What are the advantages of digital communication?", a: "Higher noise immunity, easy error correction, security and easy multiplexing." },
  { ch: "10", diff: "Moderate", q: "What is the function of a mixer in a receiver?", a: "It converts the incoming RF signal into a fixed intermediate frequency." },
  { ch: "10", diff: "Moderate", q: "Why is optical fibre immune to electromagnetic interference?", a: "It uses light, which is unaffected by external electric and magnetic fields." },
  { ch: "10", diff: "Moderate", q: "Why is a coaxial cable better than a twisted pair?", a: "It has better shielding, lower loss and higher bandwidth." },
  { ch: "10", diff: "Moderate", q: "What is the function of a base station in cellular communication?", a: "It connects mobile phones in a cell to the main telephone network." },
  { ch: "10", diff: "Moderate", q: "Why are different frequencies used for uplink and downlink?", a: "To avoid interference between the strong transmitted signal and the weak received signal." },
  { ch: "10", diff: "Moderate", q: "What is GPS?", a: "Global Positioning System, a satellite-based navigation system." },
  { ch: "10", diff: "Moderate", q: "Which satellites cover the polar regions?", a: "Polar (low earth orbit) satellites at about 500–800 km." },
  { ch: "10", diff: "Moderate", q: "Why is a geostationary satellite used for communication?", a: "It stays fixed relative to the Earth, so ground antennas need no tracking." },
  { ch: "10", diff: "Moderate", q: "What is a dish antenna?", a: "A parabolic reflector that focuses microwaves onto a receiver." },
  { ch: "10", diff: "Moderate", q: "Why is the range of TV transmission limited?", a: "TV signals travel as space waves, limited by the curvature of the Earth." },
  { ch: "10", diff: "Hard", q: "Find the range of a TV tower 100 m high (R = 6.4 × 10⁶ m).", a: "d = √(2Rh) = √(2 × 6.4 × 10⁶ × 100) ≈ 35.8 km." },
  { ch: "10", diff: "Hard", q: "Find the height of an antenna needed for range 40 km.", a: "h = d²/2R = (4 × 10⁴)²/(2 × 6.4 × 10⁶) = 125 m." },
  { ch: "10", diff: "Hard", q: "Find the total range if transmitting and receiving antennas are both 100 m high.", a: "2 × 35.8 ≈ 71.6 km." },
  { ch: "10", diff: "Hard", q: "A carrier of 1 MHz is modulated by a 5 kHz signal. Find the sideband frequencies and bandwidth.", a: "995 kHz and 1005 kHz; bandwidth 10 kHz." },
  { ch: "10", diff: "Hard", q: "Find the modulation index when Am = 5 V and Ac = 10 V.", a: "μ = 0.5." },
  { ch: "10", diff: "Hard", q: "Find the total power if the carrier power is 100 W and μ = 0.5.", a: "Pt = 100(1 + 0.125) = 112.5 W." },
  { ch: "10", diff: "Hard", q: "What fraction of the total power is in the sidebands for μ = 1?", a: "(μ²/2)/(1 + μ²/2) = 1/3." },
  { ch: "10", diff: "Hard", q: "Find the number of channels of 10 kHz bandwidth in a 1 MHz band.", a: "100." },
  { ch: "10", diff: "Hard", q: "Find the critical frequency if the maximum electron density is 10¹² m⁻³.", a: "fc = 9√Nmax = 9 × 10⁶ Hz = 9 MHz." },
  { ch: "10", diff: "Hard", q: "Find the bandwidth needed for a signal of 4 kHz in AM.", a: "8 kHz." },
  { ch: "10", diff: "Hard", q: "State the sampling theorem.", a: "To reconstruct a signal, the sampling frequency must be at least twice its highest frequency." },
  { ch: "10", diff: "Hard", q: "Why is a modulating signal not directly transmitted?", a: "Low-frequency signals need very long antennas, radiate poorly and signals would mix." },
  { ch: "10", diff: "Hard", q: "How does a satellite extend the line-of-sight range?", a: "It acts as a high-altitude repeater that can be seen from large parts of the Earth." },
  { ch: "10", diff: "Hard", q: "What is the difference between amplification and attenuation?", a: "Amplification increases signal strength; attenuation reduces it." },
  { ch: "10", diff: "Hard", q: "Explain how an AM wave is detected.", a: "A rectifier passes only one half of the wave and an RC low-pass filter removes the carrier, leaving the message envelope." },
  { ch: "10", diff: "Hard", q: "Why is the carrier frequency chosen much greater than the message frequency?", a: "So that the modulated wave has a well-defined envelope and radiates efficiently." },
  { ch: "10", diff: "Hard", q: "What is the use of an optical fibre in communication?", a: "It carries light signals by total internal reflection with very low loss and large bandwidth." },
  { ch: "10", diff: "Hard", q: "What is the need for a base-band signal to be modulated for long distance?", a: "Because direct transmission of base-band signals suffers heavy attenuation and interference." },
  { ch: "10", diff: "Hard", q: "What happens to the range if the antenna height is made four times?", a: "The range doubles since d ∝ √h." },
  { ch: "10", diff: "Hard", q: "Compare ground wave and sky wave propagation.", a: "Ground waves follow Earth's surface and suit low frequencies; sky waves are reflected by the ionosphere and suit 3–30 MHz." }
];

        // JS Logic
        const container = document.getElementById('questionContainer');
        const chapterFilter = document.getElementById('chapterFilter');
        const difficultyFilter = document.getElementById('difficultyFilter');
        const searchInput = document.getElementById('searchInput');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');

        let currentPage = 1;
        const itemsPerPage = 100;
        let filteredData = [...physicsData];

        function updateUI() {
            const selectedChapter = chapterFilter.value;
            const selectedDifficulty = difficultyFilter.value;
            const searchText = searchInput.value.toLowerCase();

            filteredData = physicsData.filter(item => {
                const matchChapter = selectedChapter === 'all' || item.ch === selectedChapter;
                const matchDifficulty = selectedDifficulty === 'all' || item.diff === selectedDifficulty;
                const matchSearch = item.q.toLowerCase().includes(searchText) || item.a.toLowerCase().includes(searchText);
                return matchChapter && matchDifficulty && matchSearch;
            });

            const totalPages = Math.ceil(filteredData.length / itemsPerPage) || 1;
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedData = filteredData.slice(startIndex, endIndex);

            container.innerHTML = '';
            if (paginatedData.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No questions found.</p>';
            } else {
                paginatedData.forEach((item, index) => {
                    const globalIndex = startIndex + index + 1;
                    const div = document.createElement('div');
                    div.className = 'question-item';
                    div.innerHTML = `
                        <div style="margin-bottom: 5px;">
                            <span class="badge ${item.diff}">${item.diff}</span>
                            <span class="q-text">Q${globalIndex}: ${item.q}</span>
                        </div>
                        <div>
                            <span class="a-text">Ans: ${item.a}</span>
                        </div>
                    `;
                    container.appendChild(div);
                });
            }

            pageInfo.textContent = `Page ${currentPage} of ${totalPages} (Total: ${filteredData.length} Questions)`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
        }

        function changePage(direction) {
            currentPage += direction;
            updateUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        chapterFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        difficultyFilter.addEventListener('change', () => { currentPage = 1; updateUI(); });
        searchInput.addEventListener('input', () => { currentPage = 1; updateUI(); });

        updateUI();
    </script>
