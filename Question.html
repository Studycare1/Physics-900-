  { ch: "2", diff: "Moderate", q: "When is combining cells in parallel useful?", a: "When external resistance is much less than internal resistance." },
  { ch: "2", diff: "Moderate", q: "What is the terminal voltage of a cell when it is being charged?", a: "V = E + Ir" },
  { ch: "2", diff: "Moderate", q: "What is the potential gradient in a potentiometer?", a: "Potential drop per unit length (k = V/L)." },
  { ch: "2", diff: "Moderate", q: "Why is the potentiometer wire kept uniform?", a: "To ensure a uniform potential gradient." },
  { ch: "2", diff: "Moderate", q: "Why is a shunt used in an ammeter?", a: "To bypass most of the current and protect the galvanometer." },
  { ch: "2", diff: "Moderate", q: "Write the formula for shunt resistance.", a: "S = (Ig * G) / (I - Ig)" },
  { ch: "2", diff: "Moderate", q: "What is the efficiency of a cell?", a: "Ratio of output power to input power." },
  { ch: "2", diff: "Moderate", q: "State the maximum power transfer theorem.", a: "Max power is transferred when external R equals internal r." },
  { ch: "2", diff: "Moderate", q: "What is the maximum power delivered by a cell?", a: "Pmax = E² / (4r)" },
  { ch: "2", diff: "Moderate", q: "What is the disadvantage of a Wheatstone bridge?", a: "It is less sensitive when all resistances are of the same order." },
  { ch: "2", diff: "Moderate", q: "What is end error in a meter bridge?", a: "Error due to the shift of zero mark at the ends of the wire." },
  { ch: "2", diff: "Moderate", q: "How can end error be minimized?", a: "By interchanging the resistances and taking the average." },
  { ch: "2", diff: "Moderate", q: "What is the temperature coefficient of resistance for metals?", a: "Positive" },
  { ch: "2", diff: "Moderate", q: "What is the temperature coefficient of resistance for semiconductors?", a: "Negative" },
  { ch: "2", diff: "Moderate", q: "Why does the resistance of a semiconductor decrease with temperature?", a: "More charge carriers are generated due to breaking of bonds." },
  { ch: "2", diff: "Moderate", q: "What is the formula for power in terms of current and resistance?", a: "P = I²R" },
  { ch: "2", diff: "Moderate", q: "What is the formula for power in terms of voltage and resistance?", a: "P = V²/R" },
  { ch: "2", diff: "Moderate", q: "What is the relation between EMF and terminal voltage?", a: "V = E - Ir" },
  { ch: "2", diff: "Moderate", q: "How does the drift velocity of electrons change if the current is doubled?", a: "It doubles." },
  { ch: "2", diff: "Hard", q: "What is the relation between E, V, and r?", a: "V = E - Ir" },
  { ch: "2", diff: "Hard", q: "What is the formula for equivalent resistance in series?", a: "Rs = R1 + R2 + R3" },
  { ch: "2", diff: "Hard", q: "What is the formula for drift velocity in terms of current?", a: "I = neAvd" },
  { ch: "2", diff: "Hard", q: "What is the relation between resistivity and relaxation time?", a: "ρ = m / (ne²τ)" },
  { ch: "2", diff: "Hard", q: "What is the condition for a balanced Wheatstone bridge?", a: "P/Q = R/S" },
  { ch: "2", diff: "Hard", q: "What is the maximum current that can be drawn from a cell?", a: "Imax = E/r (when R=0)" },
  { ch: "2", diff: "Hard", q: "What is the temp coefficient of resistivity for alloys?", a: "Very small and positive." },
  { ch: "2", diff: "Hard", q: "What is the relation between current and drift velocity?", a: "I = nAevd" },
  { ch: "2", diff: "Hard", q: "What is the average speed of electrons in a conductor without an electric field?", a: "~10⁶ m/s (thermal speed)." },
  { ch: "2", diff: "Hard", q: "What is the speed of the electric field in a conductor?", a: "Approximately the speed of light (3 × 10⁸ m/s)." },
  { ch: "2", diff: "Hard", q: "Why is drift velocity much smaller than thermal velocity?", a: "Because of frequent collisions with the lattice ions." },
  { ch: "2", diff: "Hard", q: "Define mobility of electrons.", a: "Drift velocity acquired by an electron per unit electric field." },
  { ch: "2", diff: "Hard", q: "Write the relation between resistivity and electron mobility.", a: "ρ = m / (ne²τ) = 1/(neμ)" },
  { ch: "2", diff: "Hard", q: "What is the difference between resistance and resistivity?", a: "Resistance depends on dimensions; resistivity is an intrinsic property." },
  { ch: "2", diff: "Hard", q: "What is the relation between current density (J) and electric field (E)?", a: "J = σE (Ohm's Law in microscopic form)." },
  { ch: "2", diff: "Hard", q: "What are the limitations of Ohm's Law?", a: "Not valid for non-linear devices like diodes, transistors, and electrolytes." },
  { ch: "2", diff: "Hard", q: "What is the potential gradient if a potentiometer wire of length L has voltage V?", a: "k = V/L" },
  { ch: "2", diff: "Hard", q: "What is the principle of a potentiometer?", a: "Potential drop is directly proportional to length." },
  { ch: "3", diff: "Simple", q: "What is the SI unit of magnetic field?", a: "Tesla (T)" },
  { ch: "3", diff: "Simple", q: "State right-hand thumb rule.", a: "Thumb shows current, fingers show B-field." },
  { ch: "3", diff: "Simple", q: "What is the SI unit of magnetic flux?", a: "Weber (Wb)" },
  { ch: "3", diff: "Simple", q: "What is a diamagnetic material?", a: "Weakly repelled by magnets." },
  { ch: "3", diff: "Simple", q: "What is a ferromagnetic material?", a: "Strongly attracted by magnets (e.g., Iron)." },
  { ch: "3", diff: "Simple", q: "What is a neutral point?", a: "Where net magnetic field is zero." },
  { ch: "3", diff: "Simple", q: "What is the direction of B inside a solenoid?", a: "Uniform and parallel to axis." },
  { ch: "3", diff: "Simple", q: "What is the force on a charge moving parallel to B?", a: "Zero" },
  { ch: "3", diff: "Simple", q: "What is the SI unit of magnetic dipole moment?", a: "Am²" },
  { ch: "3", diff: "Simple", q: "What is the magnetic field at the center of a circular loop?", a: "B = μ₀I / 2R" },
  { ch: "3", diff: "Simple", q: "What is the path of a charge moving perpendicular to B?", a: "Circular" },
  { ch: "3", diff: "Simple", q: "What is the path of a charge moving at an angle to B?", a: "Helical" },
  { ch: "3", diff: "Simple", q: "What is the relation between B and H?", a: "B = μ₀H" },
  { ch: "3", diff: "Simple", q: "What is retentivity?", a: "Ability to retain magnetism after field is removed." },
  { ch: "3", diff: "Simple", q: "What is coercivity?", a: "Reverse field required to demagnetize a material." },
  { ch: "3", diff: "Simple", q: "What is the SI unit of magnetic permeability?", a: "Henry per metre (H/m), i.e. T·m/A." },
  { ch: "3", diff: "Simple", q: "What is a magnetic field line?", a: "A curve whose tangent at any point gives the direction of the magnetic field there." },
  { ch: "3", diff: "Simple", q: "What is the direction of force on a positive charge moving in a magnetic field?", a: "Perpendicular to both v and B, along v × B." },
  { ch: "3", diff: "Simple", q: "State Fleming's left-hand rule.", a: "Forefinger shows the field, middle finger the current and thumb the force, all mutually perpendicular." },
  { ch: "3", diff: "Simple", q: "What is an electromagnet?", a: "A soft iron core inside a current-carrying solenoid; it acts as a temporary strong magnet." },
  { ch: "3", diff: "Simple", q: "What is a permanent magnet?", a: "A magnet that retains its magnetism for a long time, e.g. steel." },
  { ch: "3", diff: "Simple", q: "How does a diamagnetic substance move in a non-uniform field?", a: "From the stronger to the weaker field region." },
  { ch: "3", diff: "Simple", q: "How does a paramagnetic substance move in a non-uniform field?", a: "From the weaker to the stronger field region." },
  { ch: "3", diff: "Simple", q: "State Curie's law.", a: "For a paramagnetic substance, χ is inversely proportional to absolute temperature (χ = C/T)." },
  { ch: "3", diff: "Simple", q: "What is the Curie temperature?", a: "The temperature above which a ferromagnet becomes paramagnetic." },
  { ch: "3", diff: "Simple", q: "What is the magnetic meridian?", a: "The vertical plane passing through the magnetic axis of a freely suspended magnet." },
  { ch: "3", diff: "Simple", q: "What is the angle of dip at the magnetic equator?", a: "0°." },
  { ch: "3", diff: "Simple", q: "What is the angle of dip at the magnetic poles?", a: "90°." },
  { ch: "3", diff: "Simple", q: "What is the SI unit of pole strength?", a: "Ampere-metre (A·m)." },
  { ch: "3", diff: "Simple", q: "What is the SI unit of magnetisation?", a: "Ampere per metre (A/m)." },
  { ch: "3", diff: "Simple", q: "What is the direction of the magnetic field outside a bar magnet?", a: "From the north pole to the south pole." },
  { ch: "3", diff: "Simple", q: "Do isolated magnetic monopoles exist?", a: "No, they have never been observed." },
  { ch: "3", diff: "Simple", q: "How many tesla is 1 gauss?", a: "1 gauss = 10⁻⁴ T." },
  { ch: "3", diff: "Moderate", q: "State Biot-Savart Law.", a: "dB ∝ I dl sinθ / r²" },
  { ch: "3", diff: "Moderate", q: "State Ampere's Circuital Law.", a: "∮B·dl = μ₀I" },
  { ch: "3", diff: "Moderate", q: "Write the formula for Lorentz force.", a: "F = q(E + v × B)" },
  { ch: "3", diff: "Moderate", q: "What is the torque on a current loop?", a: "τ = NIAB sinθ" },
  { ch: "3", diff: "Moderate", q: "What is the principle of a moving coil galvanometer?", a: "Torque on a current loop in B-field." },
  { ch: "3", diff: "Moderate", q: "Define angle of dip.", a: "Angle of Earth's B-field with horizontal." },
  { ch: "3", diff: "Moderate", q: "Why is soft iron used in electromagnets?", a: "High permeability, low retentivity." },
  { ch: "3", diff: "Moderate", q: "What is the force per unit length between parallel wires?", a: "F/L = μ₀I₁I₂ / 2πd" },
  { ch: "3", diff: "Moderate", q: "What is the magnetic field of a long straight wire?", a: "B = μ₀I / 2πr" },
  { ch: "3", diff: "Moderate", q: "What is magnetic susceptibility?", a: "Ratio of M to H (χ = M/H)." },
  { ch: "3", diff: "Moderate", q: "What is the relation between B, H, and M?", a: "B = μ₀(H + M)" },
  { ch: "3", diff: "Moderate", q: "How can sensitivity of a galvanometer be increased?", a: "Increase N, B, A; decrease k." },
  { ch: "3", diff: "Moderate", q: "What is a toroid?", a: "Hollow circular ring with wound wire." },
  { ch: "3", diff: "Moderate", q: "What is the magnetic field inside a solenoid?", a: "B = μ₀nI" },
  { ch: "3", diff: "Moderate", q: "A charge q moves with speed v perpendicular to a field B. Find the force.", a: "F = qvB." },
  { ch: "3", diff: "Moderate", q: "A proton moves at 2 × 10⁶ m/s perpendicular to a 0.5 T field. Find the radius of its path.", a: "r = mv/qB ≈ 4.2 cm." },
  { ch: "3", diff: "Moderate", q: "Find the magnetic field at 5 cm from a long straight wire carrying 10 A.", a: "B = μ₀I/2πr = 4 × 10⁻⁵ T." },
  { ch: "3", diff: "Moderate", q: "A solenoid has 500 turns per metre and carries 2 A. Find the field inside.", a: "B = μ₀nI ≈ 1.26 × 10⁻³ T." },
  { ch: "3", diff: "Moderate", q: "A coil of 100 turns and radius 10 cm carries 2 A. Find the field at its centre.", a: "B = μ₀NI/2R ≈ 1.26 × 10⁻³ T." },
  { ch: "3", diff: "Moderate", q: "Find the force on a 0.5 m wire carrying 4 A perpendicular to a 0.2 T field.", a: "F = BIL = 0.4 N." },
  { ch: "3", diff: "Moderate", q: "Find the force per metre between two wires 10 cm apart, each carrying 10 A in the same direction.", a: "F/L = μ₀I₁I₂/2πd = 2 × 10⁻⁴ N/m (attractive)." },
  { ch: "3", diff: "Moderate", q: "Find the maximum torque on a 50-turn coil of area 0.02 m² carrying 3 A in a 0.4 T field.", a: "τ = NIAB = 1.2 N·m." },
  { ch: "3", diff: "Moderate", q: "Define the ampere in terms of the force between wires.", a: "The current which, in two long parallel wires 1 m apart in vacuum, produces a force of 2 × 10⁻⁷ N per metre of length." },
  { ch: "3", diff: "Moderate", q: "Find the shunt needed to convert a galvanometer (G = 50 Ω, Ig = 5 mA) into a 0–1 A ammeter.", a: "S = IgG/(I − Ig) ≈ 0.251 Ω." },
  { ch: "3", diff: "Moderate", q: "Find the series resistance to convert the same galvanometer into a 0–10 V voltmeter.", a: "R = V/Ig − G = 1950 Ω." },
  { ch: "3", diff: "Moderate", q: "On what does the cyclotron frequency depend?", a: "Only on q, m and B; it is independent of speed and radius." },
  { ch: "3", diff: "Moderate", q: "What is the principle of a cyclotron?", a: "A charged particle gains energy each time it crosses an alternating electric field while moving in a circle in a magnetic field." },
  { ch: "3", diff: "Moderate", q: "Why can a cyclotron not accelerate electrons effectively?", a: "Their small mass makes them relativistic quickly, so they fall out of resonance." },
  { ch: "3", diff: "Moderate", q: "Write the maximum kinetic energy of a particle in a cyclotron.", a: "K = q²B²R²/2m." },
  { ch: "3", diff: "Moderate", q: "What is the Hall effect?", a: "A transverse potential difference appears across a current-carrying conductor placed in a perpendicular magnetic field." },
  { ch: "3", diff: "Moderate", q: "Find the magnetic moment of a bar magnet with pole strength 20 A·m and length 10 cm.", a: "M = m × 2l = 2 A·m²." },
  { ch: "3", diff: "Moderate", q: "State the Curie–Weiss law.", a: "Above the Curie temperature, χ = C/(T − Tc) for a ferromagnet." },
  { ch: "3", diff: "Moderate", q: "How does temperature affect paramagnetism?", a: "Paramagnetism decreases with increasing temperature." },
  { ch: "3", diff: "Moderate", q: "Why is diamagnetism independent of temperature?", a: "It arises from induced orbital moments, not from alignment of permanent dipoles." },
  { ch: "3", diff: "Moderate", q: "What are magnetic domains?", a: "Small regions in ferromagnets in which atomic moments are aligned in the same direction." },
  { ch: "3", diff: "Moderate", q: "What is the field outside an ideal toroid?", a: "Zero." },
  { ch: "3", diff: "Hard", q: "What is the magnetic field on the axis of a circular loop?", a: "B = μ₀IR² / 2(R²+x²)^(3/2)" },
  { ch: "3", diff: "Hard", q: "What is the relation between relative permeability and susceptibility?", a: "μr = 1 + χ" },
  { ch: "3", diff: "Hard", q: "What is the force on a current-carrying wire in a B-field?", a: "F = I(L × B)" },
  { ch: "3", diff: "Hard", q: "What is the work done by a magnetic force?", a: "Zero" },
  { ch: "3", diff: "Hard", q: "What is hysteresis loss?", a: "Energy lost as heat due to repeated magnetization." },
  { ch: "3", diff: "Hard", q: "What is the formula for the magnetic moment of a revolving electron?", a: "m = evr/2" },
  { ch: "3", diff: "Hard", q: "What is the Bohr magneton value?", a: "9.27 × 10⁻²⁴ A·m²" },
  { ch: "3", diff: "Hard", q: "Derive the force between two long parallel current-carrying wires.", a: "Field due to wire 1 at wire 2 is μ₀I₁/2πd; force on length L is BI₂L = μ₀I₁I₂L/2πd." },
  { ch: "3", diff: "Hard", q: "Derive the torque on a rectangular current loop in a uniform field.", a: "Forces on opposite sides form a couple, so τ = IabB sinθ = IAB sinθ." },
  { ch: "3", diff: "Hard", q: "A charge enters a field B at 30° to the field with speed v. Find the pitch of the helix.", a: "p = v cos30° × 2πm/qB = √3πmv/qB." },
  { ch: "3", diff: "Hard", q: "Find the ratio of radii of an α-particle and a proton having the same kinetic energy in the same field.", a: "r = √(2mK)/qB, so rα : rp = 1 : 1." },
  { ch: "3", diff: "Hard", q: "Find the ratio of radii of a deuteron and a proton moving with the same speed in the same field.", a: "r ∝ m/q, so rd/rp = 2." },
  { ch: "3", diff: "Hard", q: "A galvanometer of 100 Ω gives full scale at 10 mA. Find the voltage across it.", a: "V = IgG = 1 V." },
  { ch: "3", diff: "Hard", q: "Find the field at the centre of a semicircular wire of radius R carrying current I.", a: "B = μ₀I/4R." },
  { ch: "3", diff: "Hard", q: "Find the field at the centre of a quarter-circular arc of radius R carrying current I.", a: "B = μ₀I/8R." },
  { ch: "3", diff: "Hard", q: "Find the field on the axis of a circular loop at a distance x = R from its centre.", a: "B = μ₀IR²/2(2R²)^(3/2) = μ₀I/(4√2 R)." },
  { ch: "3", diff: "Hard", q: "Using Biot–Savart law, derive the field at the centre of a circular loop.", a: "B = ∫μ₀Idl/4πR² = μ₀I(2πR)/4πR² = μ₀I/2R." },
  { ch: "3", diff: "Hard", q: "Find the work done in rotating a magnetic dipole from θ = 0 to θ.", a: "W = MB(1 − cosθ)." },
  { ch: "3", diff: "Hard", q: "Why is the field in a thick toroid not uniform over its cross-section?", a: "B varies as 1/r across the cross-section; it is nearly uniform only for a thin toroid." },
  { ch: "3", diff: "Hard", q: "Show that the magnetic force on a moving charge does no work.", a: "F is perpendicular to v, so power F·v = 0 and kinetic energy stays constant." },
  { ch: "3", diff: "Hard", q: "Compare materials for a transformer core and a permanent magnet using hysteresis loops.", a: "Transformer core: soft iron with a narrow loop (low loss); permanent magnet: steel with a wide loop (high retentivity and coercivity)." },
  { ch: "3", diff: "Hard", q: "At a place BH = 0.3 G and the dip angle is 60°. Find the total field.", a: "B = BH/cos60° = 0.6 G." },
  { ch: "4", diff: "Simple", q: "State Faraday's Law.", a: "emf = -dΦ/dt" },
  { ch: "4", diff: "Simple", q: "State Lenz's Law.", a: "Induced current opposes flux change." },
  { ch: "4", diff: "Simple", q: "What is the SI unit of self-inductance?", a: "Henry (H)" },
  { ch: "4", diff: "Simple", q: "What is the frequency of AC in India?", a: "50 Hz" },
  { ch: "4", diff: "Simple", q: "What is the average value of AC over a full cycle?", a: "Zero" },
  { ch: "4", diff: "Simple", q: "What is the relation between peak and RMS V?", a: "Vrms = V₀ / √2" },
  { ch: "4", diff: "Simple", q: "On what principle does a transformer work?", a: "Mutual Induction" },
  { ch: "4", diff: "Simple", q: "What is a step-up transformer?", a: "Increases voltage (Ns > Np)." },
  { ch: "4", diff: "Simple", q: "What is the principle of an AC generator?", a: "Electromagnetic induction." },
  { ch: "4", diff: "Simple", q: "What is a choke coil?", a: "High inductance, low resistance coil." },
  { ch: "4", diff: "Simple", q: "What is the power factor for a pure resistor?", a: "1" },
  { ch: "4", diff: "Simple", q: "What is the phase difference in a pure inductor?", a: "90° (current lags)." },
  { ch: "4", diff: "Simple", q: "What is the phase difference in a pure capacitor?", a: "90° (current leads)." },
  { ch: "4", diff: "Simple", q: "Write the formula for induced emf in a rotating coil.", a: "e = NBAω sin(ωt)" },
  { ch: "4", diff: "Simple", q: "What is the SI unit of magnetic flux?", a: "Weber (Wb)" },
  { ch: "4", diff: "Simple", q: "What is magnetic flux?", a: "Φ = BA cosθ, the number of magnetic field lines passing through a surface." },
  { ch: "4", diff: "Simple", q: "What is the SI unit of induced emf?", a: "Volt (V)." },
  { ch: "4", diff: "Simple", q: "What is back emf?", a: "The emf induced in a motor coil that opposes the applied voltage." },
  { ch: "4", diff: "Simple", q: "What is a dynamo?", a: "A device that converts mechanical energy into electrical energy." },
  { ch: "4", diff: "Simple", q: "What is the time period of AC mains in India?", a: "0.02 s." },
  { ch: "4", diff: "Simple", q: "What is a transformer?", a: "A device that changes the AC voltage using mutual induction." },
  { ch: "4", diff: "Simple", q: "What is the efficiency of an ideal transformer?", a: "100%." },
  { ch: "4", diff: "Simple", q: "Which material is used for transformer cores?", a: "Laminated soft iron." },
  { ch: "4", diff: "Simple", q: "What is the instantaneous value of AC?", a: "The value at a particular instant, e.g. I = I₀ sin ωt." },
  { ch: "4", diff: "Simple", q: "What is the angular frequency of 50 Hz AC?", a: "ω = 2πf = 100π rad/s." },
  { ch: "4", diff: "Simple", q: "What does an AC ammeter read?", a: "The rms value of the current." },
  { ch: "4", diff: "Simple", q: "What does 220 V mean for AC mains?", a: "The rms voltage; the peak value is about 311 V." },
  { ch: "4", diff: "Simple", q: "What is resonance in an LCR circuit?", a: "The condition XL = XC, when impedance is minimum and current is maximum." },
  { ch: "4", diff: "Simple", q: "What is the principle of a radio tuning circuit?", a: "Resonance in an LC circuit tuned by varying C or L." },
  { ch: "4", diff: "Simple", q: "What is an induction furnace?", a: "A furnace that heats and melts metals by eddy currents." },
  { ch: "4", diff: "Simple", q: "What is electromagnetic damping?", a: "Damping of motion by eddy currents, used in galvanometers and balances." },
  { ch: "4", diff: "Simple", q: "State Fleming's right-hand rule.", a: "Thumb shows motion, forefinger the field and middle finger the induced current." },
  { ch: "4", diff: "Moderate", q: "What are eddy currents?", a: "Circulating currents in bulk conductors." },
  { ch: "4", diff: "Moderate", q: "Write the formula for power factor.", a: "cos φ = R/Z" },
  { ch: "4", diff: "Moderate", q: "What happens at resonance in an LCR circuit?", a: "Z = R (min), I is max." },
  { ch: "4", diff: "Moderate", q: "Why is a transformer not used for DC?", a: "No flux change, no induced emf." },
  { ch: "4", diff: "Moderate", q: "What is displacement current?", a: "Current due to changing E-field." },
  { ch: "4", diff: "Moderate", q: "What is the quality factor (Q-factor)?", a: "Q = (1/R)√(L/C)" },
  { ch: "4", diff: "Moderate", q: "What is the formula for impedance in an LCR circuit?", a: "Z = √(R² + (XL - XC)²)" },
  { ch: "4", diff: "Moderate", q: "What is the resonant frequency formula?", a: "f = 1 / (2π√(LC))" },
  { ch: "4", diff: "Moderate", q: "What is the power consumed in a pure capacitor?", a: "Zero" },
  { ch: "4", diff: "Moderate", q: "What is the power consumed in a pure inductor?", a: "Zero" },
  { ch: "4", diff: "Moderate", q: "What is the relation between mutual inductance and coupling?", a: "M = k√(L1L2)" },
  { ch: "4", diff: "Moderate", q: "What is the formula for energy stored in an inductor?", a: "U = 1/2 LI²" },
  { ch: "4", diff: "Moderate", q: "What is the direction of induced current?", a: "Opposes flux change (Lenz's law)." },
  { ch: "4", diff: "Moderate", q: "What is the formula for average power in AC?", a: "P = Vrms Irms cos φ" },
  { ch: "4", diff: "Moderate", q: "Flux changes from 0.5 Wb to 0.1 Wb in 0.2 s. Find the induced emf.", a: "e = ΔΦ/Δt = 2 V." },
  { ch: "4", diff: "Moderate", q: "A 0.5 m rod moves at 4 m/s perpendicular to a 0.2 T field. Find the emf.", a: "e = Bvl = 0.4 V." },
  { ch: "4", diff: "Moderate", q: "An emf of 8 V is induced when current changes at 4 A/s. Find L.", a: "L = e/(dI/dt) = 2 H." },
  { ch: "4", diff: "Moderate", q: "Find the energy stored in a 2 H inductor carrying 3 A.", a: "U = ½LI² = 9 J." },
  { ch: "4", diff: "Moderate", q: "Find the rms value for a peak voltage of 311 V.", a: "311/√2 ≈ 220 V." },
  { ch: "4", diff: "Moderate", q: "Find the peak current when the rms current is 10 A.", a: "I₀ = 10√2 ≈ 14.1 A." },
  { ch: "4", diff: "Moderate", q: "A 100 Ω resistor is connected to 220 V AC. Find the rms current.", a: "2.2 A." },
  { ch: "4", diff: "Moderate", q: "Find XL of a 0.5 H inductor at 50 Hz.", a: "2π × 50 × 0.5 ≈ 157 Ω." },
  { ch: "4", diff: "Moderate", q: "Find XC of a 10 μF capacitor at 50 Hz.", a: "1/(2π × 50 × 10⁻⁵) ≈ 318 Ω." },
  { ch: "4", diff: "Moderate", q: "Find the resonant frequency for L = 1 mH and C = 10 μF.", a: "f = 1/2π√LC ≈ 1592 Hz." },
  { ch: "4", diff: "Moderate", q: "A transformer has Np = 100, Ns = 500 and Vp = 220 V. Find Vs.", a: "1100 V." },
  { ch: "4", diff: "Moderate", q: "An ideal step-down transformer has Ip = 1 A and a turns ratio 10:1. Find Is.", a: "Is = 10 A." },
  { ch: "4", diff: "Moderate", q: "A transformer is 90% efficient with 1000 W input. Find the output.", a: "900 W." },
  { ch: "4", diff: "Moderate", q: "Find the power factor of a series circuit with R = 30 Ω and XL = 40 Ω.", a: "Z = 50 Ω, so cosφ = 0.6." },
  { ch: "4", diff: "Moderate", q: "Find the average power for V = 220 V, I = 5 A and cosφ = 0.8.", a: "880 W." },
  { ch: "4", diff: "Moderate", q: "What is the power factor at resonance?", a: "1." },
  { ch: "4", diff: "Moderate", q: "Why does an inductor pass DC but oppose AC?", a: "For DC, f = 0 so XL = 0; for AC, XL = 2πfL." },
  { ch: "4", diff: "Moderate", q: "Why does a capacitor block DC but pass AC?", a: "XC = 1/2πfC is infinite for f = 0." },
  { ch: "4", diff: "Moderate", q: "What is the phase relation in series LCR below resonance?", a: "The circuit is capacitive; current leads voltage." },
  { ch: "4", diff: "Moderate", q: "What is the phase relation in series LCR above resonance?", a: "The circuit is inductive; current lags voltage." },
  { ch: "4", diff: "Moderate", q: "What is the half-power bandwidth of a series LCR circuit?", a: "Δf = R/2πL = f₀/Q." },
  { ch: "4", diff: "Moderate", q: "What is the average value of AC over a half cycle?", a: "2I₀/π = 0.637 I₀." },
  { ch: "4", diff: "Moderate", q: "What is the form factor of sinusoidal AC?", a: "1.11." },
  { ch: "4", diff: "Moderate", q: "Define mutual inductance.", a: "M = Φ₂/I₁, the flux linked with coil 2 per unit current in coil 1." },
  { ch: "4", diff: "Moderate", q: "Why is a spark seen when a circuit is suddenly broken?", a: "A large back emf −L dI/dt is induced by the rapidly falling current." },
  { ch: "4", diff: "Moderate", q: "How is hysteresis loss reduced in a transformer?", a: "By using a soft iron core with a narrow hysteresis loop." },
  { ch: "4", diff: "Moderate", q: "Why is electric power transmitted at high voltage?", a: "For the same power, a higher voltage gives lower current and hence lower I²R loss." },
  { ch: "4", diff: "Hard", q: "What is the phase relation between V and I in an LCR circuit?", a: "tan φ = (XL - XC)/R" },
  { ch: "4", diff: "Hard", q: "What is the relation between inductive reactance and frequency?", a: "XL = 2πfL (increases with f)." },
  { ch: "4", diff: "Hard", q: "What is the relation between capacitive reactance and frequency?", a: "XC = 1/(2πfC) (decreases with f)." },
  { ch: "4", diff: "Hard", q: "What is the wattless current?", a: "Current that consumes zero average power." },
  { ch: "4", diff: "Hard", q: "What is the condition for resonance in an LCR circuit?", a: "XL = XC" },
  { ch: "4", diff: "Hard", q: "Why is the core of a transformer laminated?", a: "To reduce eddy current losses." },
  { ch: "4", diff: "Hard", q: "A coil with N = 100 and A = 0.02 m² rotates at 50 rev/s in B = 0.5 T. Find the peak emf.", a: "E₀ = NBAω = 100 × 0.5 × 0.02 × 100π ≈ 314 V." },
  { ch: "4", diff: "Hard", q: "R = 100 Ω, L = 0.1 H and C = 100 μF are in series across 220 V, 50 Hz. Find the impedance.", a: "XL = 31.4 Ω, XC = 31.8 Ω, so Z ≈ 100 Ω (almost resonance)." },
  { ch: "4", diff: "Hard", q: "Find the Q-factor for L = 2 mH, C = 0.02 μF and R = 10 Ω.", a: "Q = (1/R)√(L/C) ≈ 31.6." },
  { ch: "4", diff: "Hard", q: "Derive the emf induced in a rod of length l rotating with angular speed ω about one end in a field B.", a: "e = ½Bωl²." },
  { ch: "4", diff: "Hard", q: "Derive the energy density of a magnetic field.", a: "From U = ½LI² with L = μ₀n²Al and B = μ₀nI, u = B²/2μ₀." },
  { ch: "4", diff: "Hard", q: "Derive Vs/Vp = Ns/Np for an ideal transformer.", a: "The same flux passes through both coils, so Vp = −Np dΦ/dt and Vs = −Ns dΦ/dt." },
  { ch: "4", diff: "Hard", q: "Show that the current leads the voltage by 90° in a pure capacitor.", a: "q = CV₀ sinωt, so i = dq/dt = ωCV₀ cosωt." },
  { ch: "4", diff: "Hard", q: "Find the self-inductance of a solenoid: 1000 turns, length 0.5 m, area 4 × 10⁻⁴ m².", a: "L = μ₀N²A/l ≈ 1.0 × 10⁻³ H." },
  { ch: "4", diff: "Hard", q: "The mutual inductance is 0.5 H. Current in one coil falls from 4 A to 0 in 0.1 s. Find the emf in the other.", a: "e = MΔI/Δt = 20 V." },
  { ch: "4", diff: "Hard", q: "Show that the average power in a pure inductor is zero.", a: "P = average of V₀I₀ sinωt cosωt over a cycle = 0." },
  { ch: "4", diff: "Hard", q: "In a series LCR circuit VR = 40 V, VL = 100 V, VC = 70 V. Find the supply voltage.", a: "V = √(40² + 30²) = 50 V." },
  { ch: "4", diff: "Hard", q: "How does a choke coil differ from a resistor in limiting current?", a: "A choke limits current with negligible power loss (wattless); a resistor dissipates I²R." },
  { ch: "4", diff: "Hard", q: "Why does a magnet fall slowly through a copper tube?", a: "Eddy currents induced in the tube oppose its motion (Lenz's law)." },
  { ch: "4", diff: "Hard", q: "A circular loop of radius 10 cm is in a perpendicular field of 0.5 T which drops to zero in 0.1 s. Find the emf.", a: "e = BA/t = 0.5 × π × 0.01/0.1 ≈ 0.157 V." },
  { ch: "4", diff: "Hard", q: "Write the instantaneous emf for V₀ = 200 V and f = 50 Hz.", a: "e = 200 sin(100πt)." },
  { ch: "5", diff: "Simple", q: "What is the speed of EM waves in vacuum?", a: "3 × 10⁸ m/s" },
  { ch: "5", diff: "Simple", q: "Are EM waves transverse?", a: "Yes" },
  { ch: "5", diff: "Simple", q: "Which EM wave has shortest wavelength?", a: "Gamma rays" },
  { ch: "5", diff: "Simple", q: "Which EM wave has longest wavelength?", a: "Radio waves" },
  { ch: "5", diff: "Simple", q: "Who predicted EM waves?", a: "Maxwell" },
  { ch: "5", diff: "Simple", q: "Who experimentally discovered EM waves?", a: "Hertz" },
  { ch: "5", diff: "Simple", q: "Which waves are used in microwave ovens?", a: "Microwaves" },
  { ch: "5", diff: "Simple", q: "Which waves are used in RADAR?", a: "Microwaves/Radio waves" },
  { ch: "5", diff: "Simple", q: "Which waves cause sunburn?", a: "UV rays" },
  { ch: "5", diff: "Simple", q: "Which waves are used in TV remotes?", a: "Infrared" },
  { ch: "5", diff: "Simple", q: "Which waves are used in medical imaging?", a: "X-rays" },
  { ch: "5", diff: "Simple", q: "Do EM waves need a medium?", a: "No" },
  { ch: "5", diff: "Simple", q: "What is the wavelength range of visible light?", a: "400 nm to 700 nm" },
  { ch: "5", diff: "Simple", q: "What is displacement current?", a: "Current due to changing E-field." },
  { ch: "5", diff: "Simple", q: "Write the relation between c, μ₀, ε₀.", a: "c = 1/√(μ₀ε₀)" },
  { ch: "5", diff: "Simple", q: "Who first produced EM waves in the laboratory?", a: "Heinrich Hertz." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used for sterilising water?", a: "Ultraviolet rays." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used in physiotherapy?", a: "Infrared rays." },
  { ch: "5", diff: "Simple", q: "Which EM waves are called heat waves?", a: "Infrared waves." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used in cancer treatment?", a: "Gamma rays and X-rays." },
  { ch: "5", diff: "Simple", q: "Which waves are used in AM radio broadcast?", a: "Medium-frequency radio waves (530–1700 kHz)." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used in mobile phones?", a: "Microwaves (UHF radio waves)." },
  { ch: "5", diff: "Simple", q: "Do EM waves carry energy and momentum?", a: "Yes; momentum p = E/c." },
  { ch: "5", diff: "Simple", q: "What is the source of EM waves?", a: "Accelerated (oscillating) charges." },
  { ch: "5", diff: "Simple", q: "What is the unit of E₀/B₀?", a: "m/s." },
  { ch: "5", diff: "Simple", q: "What is the speed of EM waves in a medium?", a: "v = 1/√(με)." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used to detect forged notes?", a: "Ultraviolet rays." },
  { ch: "5", diff: "Simple", q: "What does the ozone layer absorb?", a: "Harmful ultraviolet radiation from the Sun." },
  { ch: "5", diff: "Simple", q: "What is the greenhouse effect?", a: "Trapping of infrared radiation by atmospheric gases like CO₂ and CH₄, warming the Earth." },
  { ch: "5", diff: "Simple", q: "Which EM waves are used in LASIK eye surgery?", a: "Ultraviolet rays." },
  { ch: "5", diff: "Simple", q: "What is the role of the ionosphere for radio waves?", a: "It reflects them back to Earth." },
  { ch: "5", diff: "Moderate", q: "What is the direction of EM wave propagation?", a: "E × B" },
  { ch: "5", diff: "Moderate", q: "What is the amplitude ratio of E to B?", a: "E₀/B₀ = c" },
  { ch: "5", diff: "Moderate", q: "What is Gauss's law for magnetism?", a: "∮B·dA = 0" },
  { ch: "5", diff: "Moderate", q: "What is the Poynting vector?", a: "S = (1/μ₀)(E × B)" },
  { ch: "5", diff: "Moderate", q: "Which waves are used in satellite communication?", a: "Microwaves" },
  { ch: "5", diff: "Moderate", q: "How are X-rays produced?", a: "Rapid deceleration of high-energy electrons." },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of radio waves?", a: "500 kHz to 1000 MHz" },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of microwaves?", a: "1 GHz to 300 GHz" },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of IR?", a: "3 × 10¹¹ to 4 × 10¹⁴ Hz" },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of UV?", a: "8 × 10¹⁴ to 3 × 10¹⁶ Hz" },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of X-rays?", a: "3 × 10¹⁶ to 3 × 10¹⁹ Hz" },
  { ch: "5", diff: "Moderate", q: "What is the frequency range of gamma rays?", a: "3 × 10¹⁹ Hz and above" },
  { ch: "5", diff: "Moderate", q: "What is the energy of an EM wave proportional to?", a: "Frequency" },
  { ch: "5", diff: "Moderate", q: "What is the momentum of an EM wave?", a: "p = U/c" },
  { ch: "5", diff: "Moderate", q: "Find the wavelength of an EM wave of frequency 5 × 10¹⁴ Hz.", a: "λ = c/ν = 600 nm." },
  { ch: "5", diff: "Moderate", q: "Find the frequency of a microwave of wavelength 3 cm.", a: "10 GHz." },
  { ch: "5", diff: "Moderate", q: "The electric field amplitude is 60 V/m. Find B₀.", a: "B₀ = E₀/c = 2 × 10⁻⁷ T." },
  { ch: "5", diff: "Moderate", q: "B₀ = 5 × 10⁻⁸ T. Find E₀.", a: "E₀ = cB₀ = 15 V/m." },
  { ch: "5", diff: "Moderate", q: "Find the intensity of a wave with E₀ = 100 V/m.", a: "I = ½ε₀E₀²c ≈ 13.3 W/m²." },
  { ch: "5", diff: "Moderate", q: "Why are EM waves not deflected by electric or magnetic fields?", a: "They carry no charge." },
  { ch: "5", diff: "Moderate", q: "Find the energy of a 1 GHz photon.", a: "E = hν ≈ 6.6 × 10⁻²⁵ J." },
  { ch: "5", diff: "Moderate", q: "Find the speed of EM waves in glass of μ = 1.5.", a: "2 × 10⁸ m/s." },
  { ch: "5", diff: "Moderate", q: "Write the displacement current density.", a: "Jd = ε₀ ∂E/∂t." },
  { ch: "5", diff: "Moderate", q: "A capacitor is charged with a conduction current of 2 A. Find the displacement current between its plates.", a: "2 A." },
  { ch: "5", diff: "Moderate", q: "Arrange EM waves in order of increasing wavelength.", a: "Gamma, X-ray, UV, visible, IR, microwave, radio." },
  { ch: "5", diff: "Moderate", q: "Why are microwaves used for line-of-sight communication?", a: "They travel straight and pass through the ionosphere rather than being reflected." },
  { ch: "5", diff: "Moderate", q: "What did Maxwell add to Ampere's law?", a: "The displacement current term ε₀ dΦE/dt." },
  { ch: "5", diff: "Moderate", q: "Name Maxwell's four equations.", a: "Gauss's law for E, Gauss's law for B, Faraday's law and the Ampere–Maxwell law." },
  { ch: "5", diff: "Moderate", q: "What is the relation between E and B in an EM wave?", a: "They oscillate in phase, mutually perpendicular, and perpendicular to the direction of travel." },
  { ch: "5", diff: "Moderate", q: "Write the equation of an EM wave along +x with E along y.", a: "Ey = E₀ sin(kx − ωt); Bz = B₀ sin(kx − ωt)." },
  { ch: "5", diff: "Moderate", q: "What is the wave number k?", a: "k = 2π/λ." },
  { ch: "5", diff: "Moderate", q: "What is the relation between ω, k and c?", a: "ω = ck." },
  { ch: "5", diff: "Moderate", q: "What is the ratio of electric to magnetic energy density in an EM wave?", a: "1 : 1." },
  { ch: "5", diff: "Moderate", q: "What is the solar constant?", a: "About 1.4 kW/m², the solar energy received per unit area per second at Earth's distance." },
  { ch: "5", diff: "Moderate", q: "Find the wavelength of a 100 MHz wave.", a: "3 m." },
  { ch: "5", diff: "Moderate", q: "Which ionospheric layer reflects short waves?", a: "The F-layer." },
  { ch: "5", diff: "Hard", q: "What is the Maxwell-Ampere law?", a: "∮B·dl = μ₀(I + ε₀ dΦe/dt)" },
  { ch: "5", diff: "Hard", q: "What is the Maxwell-Faraday law?", a: "∮E·dl = -dΦb/dt" },
  { ch: "5", diff: "Hard", q: "What is the intensity of an EM wave?", a: "I = (1/2)ε₀E₀²c" },
  { ch: "5", diff: "Hard", q: "What is radiation pressure?", a: "Pressure exerted by EM waves (P = I/c)." },
  { ch: "5", diff: "Hard", q: "Why are gamma rays highly penetrating?", a: "High frequency and energy." },
  { ch: "5", diff: "Hard", q: "What is the source of gamma rays?", a: "Radioactive decay of nuclei." },
  { ch: "5", diff: "Hard", q: "Show dimensionally that 1/√(μ₀ε₀) has dimensions of velocity.", a: "[μ₀ε₀] = [L⁻²T²], so 1/√(μ₀ε₀) has dimensions LT⁻¹." },
  { ch: "5", diff: "Hard", q: "Find the radiation pressure of sunlight (1.4 kW/m²) on a perfectly reflecting surface.", a: "P = 2I/c ≈ 9.3 × 10⁻⁶ Pa." },
  { ch: "5", diff: "Hard", q: "Find the radiation pressure of the same sunlight on a perfectly absorbing surface.", a: "P = I/c ≈ 4.7 × 10⁻⁶ Pa." },
  { ch: "5", diff: "Hard", q: "Find the momentum delivered to an absorbing area A in time t by intensity I.", a: "p = IAt/c." },
  { ch: "5", diff: "Hard", q: "A wave has E₀ = 20 V/m. Find the average energy density.", a: "u = ½ε₀E₀² ≈ 1.77 × 10⁻⁹ J/m³." },
  { ch: "5", diff: "Hard", q: "Derive the displacement current in a charging capacitor.", a: "Id = ε₀ dΦE/dt = ε₀A dE/dt = dq/dt." },
  { ch: "5", diff: "Hard", q: "Why does Ampere's law fail for a charging capacitor without displacement current?", a: "Different surfaces bounded by the same loop enclose different currents; the surface passing between the plates has none." },
  { ch: "5", diff: "Hard", q: "Calculate c from μ₀ and ε₀.", a: "1/√(4π × 10⁻⁷ × 8.85 × 10⁻¹²) ≈ 3 × 10⁸ m/s." },
  { ch: "5", diff: "Hard", q: "Find the wavelength of a 2.45 GHz microwave oven wave.", a: "λ = c/ν ≈ 12.2 cm." },
  { ch: "5", diff: "Hard", q: "Why do microwaves heat food containing water?", a: "The frequency matches the rotational resonance of water molecules, which absorb energy and heat up." },
  { ch: "5", diff: "Hard", q: "How long does sunlight take to reach Earth (1.5 × 10¹¹ m)?", a: "About 500 s, i.e. 8.3 min." },
  { ch: "5", diff: "Hard", q: "Write the intensity at distance r from an isotropic source of power P.", a: "I = P/4πr²." },
  { ch: "5", diff: "Hard", q: "Find the electric field amplitude at 2 m from a 100 W isotropic source.", a: "I ≈ 1.99 W/m²; E₀ ≈ 39 V/m." },
  { ch: "5", diff: "Hard", q: "List the common properties of all EM waves.", a: "Transverse, speed c in vacuum, carry energy and momentum, need no medium, uncharged." },
  { ch: "5", diff: "Hard", q: "Distinguish conduction and displacement current.", a: "Conduction current is due to flow of charges; displacement current is due to a changing electric field and exists even in vacuum." },
  { ch: "6", diff: "Simple", q: "State law of reflection.", a: "∠i = ∠r" },
  { ch: "6", diff: "Simple", q: "What is the SI unit of lens power?", a: "Dioptre (D)" },
  { ch: "6", diff: "Simple", q: "Which lens corrects myopia?", a: "Concave" },
  { ch: "6", diff: "Simple", q: "Which lens corrects hypermetropia?", a: "Convex" },
  { ch: "6", diff: "Simple", q: "What is the focal length of a plane mirror?", a: "Infinity" },
  { ch: "6", diff: "Simple", q: "Write magnification formula for mirror.", a: "m = -v/u" },
  { ch: "6", diff: "Simple", q: "Write magnification formula for lens.", a: "m = v/u" },
  { ch: "6", diff: "Simple", q: "What is the speed of light in vacuum?", a: "3 × 10⁸ m/s" },
  { ch: "6", diff: "Simple", q: "What is the relation between f and R for a mirror?", a: "f = R/2" },
  { ch: "6", diff: "Simple", q: "What is the formula for critical angle?", a: "sin C = 1/n" },
  { ch: "6", diff: "Simple", q: "What is total internal reflection?", a: "Complete reflection at denser to rarer boundary." },
  { ch: "6", diff: "Simple", q: "What is dispersion?", a: "Splitting of white light." },
  { ch: "6", diff: "Simple", q: "Why is the sky blue?", a: "Rayleigh scattering." },
  { ch: "6", diff: "Simple", q: "What is the principal focus?", a: "Point where parallel rays meet." },
  { ch: "6", diff: "Simple", q: "What is the power of a normal eye?", a: "~59 D" },
  { ch: "6", diff: "Simple", q: "What is the SI unit of focal length?", a: "Metre (m)." },
  { ch: "6", diff: "Simple", q: "What type of image does a plane mirror form?", a: "Virtual, erect, same size as the object and laterally inverted." },
  { ch: "6", diff: "Simple", q: "Where is the image formed by a concave mirror when the object is at infinity?", a: "At the focus; real, inverted and highly diminished." },
  { ch: "6", diff: "Simple", q: "Where is the image formed when an object is placed at the centre of curvature of a concave mirror?", a: "At the centre of curvature; real, inverted and of the same size." },
  { ch: "6", diff: "Simple", q: "Which mirror always forms a virtual, erect and diminished image?", a: "Convex mirror." },
  { ch: "6", diff: "Simple", q: "Which mirror is used in car headlights?", a: "Concave (parabolic) mirror." },
  { ch: "6", diff: "Simple", q: "What is the sign of the focal length of a concave lens?", a: "Negative." },
  { ch: "6", diff: "Simple", q: "What is the principal axis?", a: "The line passing through the pole and centre of curvature of a mirror (or through the optical centre of a lens, perpendicular to its surfaces)." },
  { ch: "6", diff: "Simple", q: "What is the pole of a spherical mirror?", a: "The geometric centre of its reflecting surface." },
  { ch: "6", diff: "Simple", q: "What is the aperture of a mirror?", a: "The diameter of its reflecting surface." },
  { ch: "6", diff: "Simple", q: "What is the centre of curvature of a mirror?", a: "The centre of the sphere of which the mirror is a part." },
  { ch: "6", diff: "Simple", q: "What is lateral inversion?", a: "The left of the object appears as the right of the image in a plane mirror." },
  { ch: "6", diff: "Simple", q: "What is the speed of light in glass of refractive index 1.5?", a: "2 × 10⁸ m/s." },
  { ch: "6", diff: "Simple", q: "Which colour is deviated the most by a prism?", a: "Violet." },
  { ch: "6", diff: "Simple", q: "Which colour is deviated the least by a prism?", a: "Red." },
  { ch: "6", diff: "Simple", q: "Which colour travels fastest in glass?", a: "Red." },
  { ch: "6", diff: "Simple", q: "What causes a rainbow?", a: "Dispersion, refraction and total internal reflection of sunlight in water droplets." },
  { ch: "6", diff: "Simple", q: "What causes a mirage?", a: "Total internal reflection due to the variation of refractive index of air layers near a hot surface." },
  { ch: "6", diff: "Simple", q: "What is the unit of magnification?", a: "It has no unit." },
  { ch: "6", diff: "Simple", q: "What is presbyopia?", a: "Loss of accommodation with age; corrected with bifocal lenses." },
  { ch: "6", diff: "Simple", q: "What is astigmatism?", a: "An eye defect due to unequal curvature of the cornea in different planes; corrected with cylindrical lenses." },
  { ch: "6", diff: "Simple", q: "Which part of the eye provides most of the refraction?", a: "The cornea." },
  { ch: "6", diff: "Simple", q: "What is accommodation of the eye?", a: "The ability of the eye lens to change its focal length to focus objects at different distances." },
  { ch: "6", diff: "Simple", q: "What is a real image?", a: "An image formed by actual meeting of rays; it can be obtained on a screen." },
  { ch: "6", diff: "Simple", q: "What is a virtual image?", a: "An image formed where rays only appear to diverge from; it cannot be obtained on a screen." },
  { ch: "6", diff: "Simple", q: "What is an achromatic lens?", a: "A lens combination that gives no chromatic aberration." },
  { ch: "6", diff: "Simple", q: "What is the principle of a periscope?", a: "Reflection from plane mirrors (or total internal reflection in right-angled prisms)." },
  { ch: "6", diff: "Simple", q: "What is the shape of the wavefront far away from a point source?", a: "Plane." },
  { ch: "6", diff: "Simple", q: "What is the shape of the wavefront from a linear source?", a: "Cylindrical." },
  { ch: "6", diff: "Simple", q: "What is monochromatic light?", a: "Light of a single wavelength." },
  { ch: "6", diff: "Simple", q: "What are Newton's rings?", a: "Circular interference fringes formed by a thin air film between a convex lens and a plane glass plate." },
  { ch: "6", diff: "Simple", q: "What is a diffraction grating?", a: "A surface with a large number of equally spaced parallel slits." },
  { ch: "6", diff: "Simple", q: "What is the colour of the central fringe in YDSE with white light?", a: "White (bright)." },
  { ch: "6", diff: "Simple", q: "What is the SI unit of intensity of light?", a: "W/m²." },
  { ch: "6", diff: "Simple", q: "What is a Nicol prism?", a: "A device made of calcite used to produce and analyse plane-polarised light." },
  { ch: "6", diff: "Simple", q: "What is the speed of light in water of refractive index 4/3?", a: "2.25 × 10⁸ m/s." },
  { ch: "6", diff: "Simple", q: "What quantity does not change when light passes from one medium to another?", a: "Frequency." },
  { ch: "6", diff: "Simple", q: "What is the relation between speed, frequency and wavelength of light?", a: "v = νλ." },
  { ch: "6", diff: "Simple", q: "What is the image distance in a plane mirror?", a: "Equal to the object distance, behind the mirror." },
  { ch: "6", diff: "Simple", q: "By what angle does a reflected ray turn when the mirror is rotated by θ?", a: "2θ." },
  { ch: "6", diff: "Simple", q: "How many images are formed by two plane mirrors inclined at angle θ?", a: "(360°/θ) − 1, if 360°/θ is an even integer." },
  { ch: "6", diff: "Simple", q: "What is the minimum height of a plane mirror needed to see one's full image?", a: "Half the person's height." },
  { ch: "6", diff: "Moderate", q: "Write lens maker's formula.", a: "1/f = (n-1)(1/R1 - 1/R2)" },
  { ch: "6", diff: "Moderate", q: "Write the formula for fringe width in YDSE.", a: "β = λD/d" },
  { ch: "6", diff: "Moderate", q: "What are conditions for sustained interference?", a: "Coherent sources, same frequency." },
  { ch: "6", diff: "Moderate", q: "What is diffraction?", a: "Bending of light around obstacles." },
  { ch: "6", diff: "Moderate", q: "What is the relation between fringe width and slit distance?", a: "β ∝ 1/d" },
  { ch: "6", diff: "Moderate", q: "What is the relation between fringe width and wavelength?", a: "β ∝ λ" },
  { ch: "6", diff: "Moderate", q: "State Malus's Law.", a: "I = I₀ cos²θ" },
  { ch: "6", diff: "Moderate", q: "What is the resolving power?", a: "Ability to distinguish close objects." },
  { ch: "6", diff: "Moderate", q: "What is the formula for refractive index?", a: "n = c/v" },
  { ch: "6", diff: "Moderate", q: "What is the relation between object and image distance in a lens?", a: "1/v - 1/u = 1/f" },
  { ch: "6", diff: "Moderate", q: "What is the mirror formula?", a: "1/v + 1/u = 1/f" },
  { ch: "6", diff: "Moderate", q: "What is the angle of deviation for a prism?", a: "δ = i + e - A" },
  { ch: "6", diff: "Moderate", q: "What is the condition for minimum deviation?", a: "i = e" },
  { ch: "6", diff: "Moderate", q: "What is the refractive index of a prism at minimum deviation?", a: "n = sin((A+δm)/2) / sin(A/2)" },
  { ch: "6", diff: "Moderate", q: "A concave mirror has f = 10 cm. An object is 15 cm from it. Find the image distance and magnification.", a: "v = −30 cm (real, inverted); m = −2." },
  { ch: "6", diff: "Moderate", q: "A convex mirror has f = +20 cm. An object is 20 cm in front. Find the image distance and magnification.", a: "v = +10 cm (virtual, erect, behind the mirror); m = +0.5." },
  { ch: "6", diff: "Moderate", q: "A convex lens has f = 10 cm. An object is at 20 cm. Find v and m.", a: "v = +20 cm; m = −1 (real, inverted, same size)." },
  { ch: "6", diff: "Moderate", q: "A concave lens has f = −20 cm. An object is at 20 cm. Find v and m.", a: "v = −10 cm; m = +0.5 (virtual, erect, diminished)." },
  { ch: "6", diff: "Moderate", q: "Find the power of a lens of focal length 20 cm.", a: "P = 1/0.2 = +5 D." },
  { ch: "6", diff: "Moderate", q: "A glass lens (n = 1.5) of focal length f in air is immersed in water (n = 4/3). What happens to its focal length?", a: "It becomes 4 times larger (f' = 4f)." },
  { ch: "6", diff: "Moderate", q: "What is the shift of an object seen through a glass slab of thickness t and refractive index μ?", a: "Shift = t(1 − 1/μ)." },
  { ch: "6", diff: "Moderate", q: "The real depth of a tank is 12 cm of water (μ = 4/3). Find the apparent depth.", a: "9 cm." },
  { ch: "6", diff: "Moderate", q: "Find the critical angle for water (μ = 4/3).", a: "sin C = 3/4, so C ≈ 48.6°." },
  { ch: "6", diff: "Moderate", q: "Find the critical angle for glass (μ = 1.5).", a: "sin C = 2/3, so C ≈ 41.8°." },
  { ch: "6", diff: "Moderate", q: "Find the critical angle for diamond (μ = 2.42).", a: "C ≈ 24.4°." },
  { ch: "6", diff: "Moderate", q: "An equilateral prism of μ = √2. Find the angle of minimum deviation.", a: "sin((60° + δm)/2) = √2 × sin30° = 1/√2, so δm = 30°." },
  { ch: "6", diff: "Moderate", q: "Write the deviation produced by a thin prism.", a: "δ = (μ − 1)A." },
  { ch: "6", diff: "Moderate", q: "Define dispersive power of a material.", a: "ω = (n_v − n_r)/(n_y − 1)." },
  { ch: "6", diff: "Moderate", q: "What is the relation between the angles r₁ and r₂ inside a prism?", a: "r₁ + r₂ = A." },
  { ch: "6", diff: "Moderate", q: "Find the focal length of an equi-biconvex lens (μ = 1.5) of radius of curvature R.", a: "f = R." },
  { ch: "6", diff: "Moderate", q: "What is the condition for an achromatic combination of two thin lenses in contact?", a: "ω₁/f₁ + ω₂/f₂ = 0." },
  { ch: "6", diff: "Moderate", q: "Find the magnifying power of a simple microscope of f = 5 cm for image at the near point and at infinity.", a: "M = 1 + 25/5 = 6 (near point); M = 25/5 = 5 (infinity)." },
  { ch: "6", diff: "Moderate", q: "A telescope has fo = 100 cm and fe = 5 cm. Find magnifying power and tube length in normal adjustment.", a: "M = 20; length = 105 cm." },
  { ch: "6", diff: "Moderate", q: "On what does the resolving power of a telescope depend?", a: "It is proportional to D/λ, so it increases with a larger aperture and shorter wavelength." },
  { ch: "6", diff: "Moderate", q: "Find the fringe width in YDSE if λ = 500 nm, D = 1 m and d = 0.5 mm.", a: "β = λD/d = 1 mm." },
  { ch: "6", diff: "Moderate", q: "Write the position of the nth bright fringe in YDSE.", a: "xₙ = nλD/d." },
  { ch: "6", diff: "Moderate", q: "Write the position of the nth dark fringe in YDSE.", a: "xₙ = (2n − 1)λD/2d." },
  { ch: "6", diff: "Moderate", q: "Find the fringe width if λ = 6000 Å, D = 2 m and d = 2 mm.", a: "0.6 mm." },
  { ch: "6", diff: "Moderate", q: "What is the path difference at a point y on the screen in YDSE?", a: "Δ = yd/D." },
  { ch: "6", diff: "Moderate", q: "What is the relation between phase difference and path difference?", a: "φ = (2π/λ) × Δ." },
  { ch: "6", diff: "Moderate", q: "Two coherent sources have an intensity ratio 9:1. Find Imax/Imin.", a: "((3 + 1)/(3 − 1))² = 4." },
  { ch: "6", diff: "Moderate", q: "Two coherent sources have an intensity ratio 4:1. Find Imax/Imin.", a: "((2 + 1)/(2 − 1))² = 9." },
  { ch: "6", diff: "Moderate", q: "Find the width of the central maximum for a slit a = 0.2 mm, D = 1 m and λ = 600 nm.", a: "2λD/a = 6 mm." },
  { ch: "6", diff: "Moderate", q: "Find the Brewster angle for glass of μ = 1.5.", a: "θp = tan⁻¹(1.5) ≈ 56.3°." },
  { ch: "6", diff: "Moderate", q: "What is the intensity transmitted by two crossed polaroids?", a: "Zero." },
  { ch: "6", diff: "Moderate", q: "Unpolarised light of intensity I₀ passes through a polariser and an analyser at 30°. Find the final intensity.", a: "I = (I₀/2)cos²30° = 3I₀/8." },
  { ch: "6", diff: "Moderate", q: "What happens in YDSE if one slit is covered?", a: "The interference fringes disappear; only a single-slit diffraction pattern remains." },
  { ch: "6", diff: "Moderate", q: "A thin sheet of thickness t and index μ is placed over one slit in YDSE. What is the fringe shift?", a: "Shift = (μ − 1)tD/d." },
  { ch: "6", diff: "Moderate", q: "Why is diffraction of sound easier to observe than that of light?", a: "Sound has wavelengths of the order of metres, comparable to everyday obstacles." },
  { ch: "6", diff: "Moderate", q: "How can the resolving power of a microscope be increased?", a: "By using a shorter wavelength or a higher refractive index medium (oil immersion)." },
  { ch: "6", diff: "Moderate", q: "Why does the sky look blue?", a: "Rayleigh scattering is proportional to 1/λ⁴, so blue light is scattered much more." },
  { ch: "6", diff: "Moderate", q: "Why does the Sun look flattened at sunrise and sunset?", a: "Atmospheric refraction bends the light from the lower and upper edges by different amounts." },
  { ch: "6", diff: "Moderate", q: "Why do stars twinkle?", a: "Atmospheric refraction with a continuously changing refractive index varies the apparent position and brightness." },
  { ch: "6", diff: "Moderate", q: "Why does the Sun appear a couple of minutes before it actually rises?", a: "Atmospheric refraction raises its apparent position above the horizon." },
  { ch: "6", diff: "Moderate", q: "Why is a right-angled isosceles glass prism used to turn light through 90° or 180°?", a: "Glass has a critical angle (about 42°) less than 45°, so total internal reflection occurs." },
  { ch: "6", diff: "Moderate", q: "Why are reflecting telescopes preferred over refracting ones?", a: "No chromatic aberration, large mirrors can be supported from behind and they give brighter images." },
  { ch: "6", diff: "Moderate", q: "A myopic eye has far point 50 cm. Find the corrective lens power.", a: "P = −1/0.5 = −2 D." },
  { ch: "6", diff: "Moderate", q: "A hypermetropic eye has near point 50 cm. Find the corrective lens power for reading at 25 cm.", a: "u = −25 cm, v = −50 cm, f = +50 cm, so P = +2 D." },
  { ch: "6", diff: "Hard", q: "What is the Rayleigh criterion?", a: "θ = 1.22λ/D" },
  { ch: "6", diff: "Hard", q: "What is the path difference for constructive interference?", a: "nλ" },
  { ch: "6", diff: "Hard", q: "What is the path difference for destructive interference?", a: "(2n-1)λ/2" },
  { ch: "6", diff: "Hard", q: "What is Brewster's Law?", a: "tan θp = n" },
  { ch: "6", diff: "Hard", q: "What is a polarizer?", a: "Device that restricts light to a single plane." },
  { ch: "6", diff: "Hard", q: "What is chromatic aberration?", a: "Blurring due to different focal lengths for different colors." },
  { ch: "6", diff: "Hard", q: "Derive the deviation produced by a thin prism.", a: "For small angles, δ = (i + e − A) with i = μr₁ and e = μr₂, so δ = μ(r₁ + r₂) − A = (μ − 1)A." },
  { ch: "6", diff: "Hard", q: "Derive the formula for refraction at a spherical surface.", a: "Using Snell's law for small angles at the surface: n₂/v − n₁/u = (n₂ − n₁)/R." },
  { ch: "6", diff: "Hard", q: "Find the focal length of a biconvex lens with both radii 20 cm and μ = 1.5.", a: "1/f = 0.5(1/20 + 1/20) = 1/20, so f = 20 cm." },
  { ch: "6", diff: "Hard", q: "Find the focal length of a plano-convex lens with R = 10 cm and μ = 1.5.", a: "1/f = 0.5 × (1/10) so f = 20 cm." },
  { ch: "6", diff: "Hard", q: "A convex lens f = 15 cm and a concave lens f = −10 cm are placed 5 cm apart. Find the effective focal length.", a: "1/F = 1/15 − 1/10 + 5/150 = 0, so F = ∞ (afocal system)." },
  { ch: "6", diff: "Hard", q: "Two thin lenses of powers +10 D and −5 D are in contact. Find the power and focal length.", a: "P = +5 D; f = 20 cm." },
  { ch: "6", diff: "Hard", q: "An object is 10 cm from a convex lens of f = 15 cm. Find the image position and magnification.", a: "v = −30 cm (virtual); m = +3." },
  { ch: "6", diff: "Hard", q: "A concave mirror has R = 30 cm and the object is 10 cm from it. Find the image.", a: "f = −15 cm; v = +30 cm (virtual, behind the mirror); m = +3." },
  { ch: "6", diff: "Hard", q: "A glass slab has t = 6 cm and μ = √2. A ray falls at 45°. Find the lateral displacement.", a: "sin r = 0.5 so r = 30°; d = t sin(i − r)/cos r ≈ 1.79 cm." },
  { ch: "6", diff: "Hard", q: "Find the minimum deviation of a 60° prism with μ = 1.5.", a: "sin((60° + δm)/2) = 0.75, so δm ≈ 37.2°." },
  { ch: "6", diff: "Hard", q: "In YDSE, wavelengths 600 nm and 400 nm are used. Where do their bright fringes first coincide?", a: "At x = 2λ₁D/d = 3λ₂D/d (2nd order of 600 nm with 3rd order of 400 nm)." },
  { ch: "6", diff: "Hard", q: "Two coherent sources of intensity I₀ each have a phase difference of π/3 at a point. Find the resultant intensity.", a: "I = 4I₀cos²(π/6) = 3I₀." },
  { ch: "6", diff: "Hard", q: "Find the intensity at a point of YDSE where path difference is λ/4 (each source I₀).", a: "I = 4I₀cos²(π/4) = 2I₀." },
  { ch: "6", diff: "Hard", q: "Find the angular position of the first minimum for a slit a = 0.1 mm and λ = 500 nm.", a: "sinθ = λ/a = 5 × 10⁻³ rad." },
  { ch: "6", diff: "Hard", q: "A grating has 5000 lines per cm. What is the highest order visible for λ = 600 nm?", a: "d = 2 × 10⁻⁶ m; n < d/λ = 3.3, so the 3rd order." },
  { ch: "6", diff: "Hard", q: "Find the limit of resolution of a telescope of aperture 10 cm for λ = 500 nm.", a: "θ = 1.22λ/D ≈ 6.1 × 10⁻⁶ rad." },
  { ch: "6", diff: "Hard", q: "Find the angular limit of resolution of the eye (pupil 2 mm, λ = 550 nm).", a: "θ ≈ 3.4 × 10⁻⁴ rad." },
  { ch: "6", diff: "Hard", q: "Unpolarised light I₀ passes through three polaroids P₁, P₂, P₃ with 45° between successive axes. Find the final intensity.", a: "I = (I₀/2)cos²45°cos²45° = I₀/8." },
  { ch: "6", diff: "Hard", q: "Show that reflected and refracted rays are perpendicular at the Brewster angle.", a: "With μ = tan ip and Snell's law μ = sin ip/sin r, we get cos ip = sin r, so ip + r = 90°." },
  { ch: "6", diff: "Hard", q: "A glass sheet of μ = 1.5 and t = 6 μm covers one slit in YDSE with λ = 600 nm. How many fringes shift?", a: "Shift = (μ − 1)t/λ = 0.5 × 6 × 10⁻⁶/6 × 10⁻⁷ = 5 fringes." },
  { ch: "6", diff: "Hard", q: "Why is a convex lens of glass invisible in a liquid of the same refractive index?", a: "No refraction takes place at its surfaces, so its focal length becomes infinite." },
  { ch: "6", diff: "Hard", q: "When does a glass convex lens behave as a diverging lens?", a: "When immersed in a liquid whose refractive index is greater than that of glass." },
  { ch: "6", diff: "Hard", q: "Why are interference fringes of equal width while diffraction fringes are not?", a: "Interference fringe spacing is fixed by λD/d; in diffraction the secondary maxima are half as wide as the central maximum." },
  { ch: "6", diff: "Hard", q: "Why is the central maximum in single-slit diffraction brightest?", a: "All wavelets from the slit reach the centre in phase." },
  { ch: "6", diff: "Hard", q: "State two differences between a real and a virtual image.", a: "Real: formed by actually converging rays, can be projected on a screen; virtual: only appears to diverge, cannot be projected." },
  { ch: "6", diff: "Hard", q: "What is the formula for lateral magnification of a lens in terms of heights?", a: "m = h'/h = v/u." },
  { ch: "6", diff: "Hard", q: "Why does a diamond have a high brilliance?", a: "Its high refractive index (2.42) gives a small critical angle, so light undergoes repeated total internal reflection." },
  { ch: "6", diff: "Hard", q: "Why is the focal length of a lens different for red and blue light?", a: "Refractive index is larger for blue, so its focal length is shorter (chromatic aberration)." },
  { ch: "6", diff: "Hard", q: "Why is the angle of minimum deviation different for different colours?", a: "μ varies with wavelength, so violet has the larger deviation and red the smaller." },
  { ch: "6", diff: "Hard", q: "What is the thin-film condition for brightness in reflected light?", a: "2μt cos r = (2n − 1)λ/2 because of the extra π phase change on reflection from the denser medium." },
  { ch: "6", diff: "Hard", q: "What is the Doppler shift for light?", a: "Apparent frequency changes for relative motion; Δν/ν ≈ v/c (red shift when receding)." },
  { ch: "6", diff: "Hard", q: "State the sign convention used for lenses and mirrors.", a: "Cartesian convention: distances measured from the pole or optical centre; along the incident ray positive, against it negative." },
  { ch: "7", diff: "Simple", q: "What is the rest mass of a photon?", a: "Zero" },
  { ch: "7", diff: "Simple", q: "Who discovered photoelectric effect?", a: "Hertz" },
  { ch: "7", diff: "Simple", q: "Value of Planck's constant?", a: "6.626 × 10⁻³⁴ J·s" },
  { ch: "7", diff: "Simple", q: "What are photoelectrons?", a: "Electrons emitted by light." },
  { ch: "7", diff: "Simple", q: "What is threshold frequency?", a: "Min frequency to eject electrons." },
  { ch: "7", diff: "Simple", q: "What is the dual nature of light?", a: "Particle and wave." },
  { ch: "7", diff: "Simple", q: "Which effect proves particle nature?", a: "Photoelectric effect." },
  { ch: "7", diff: "Simple", q: "Which effect proves wave nature?", a: "Interference/Diffraction." },
  { ch: "7", diff: "Simple", q: "What is the SI unit of work function?", a: "Joule or eV." },
  { ch: "7", diff: "Simple", q: "What is a photon?", a: "Quantum of EM radiation." },
  { ch: "7", diff: "Simple", q: "Momentum of a photon?", a: "p = h/λ" },
  { ch: "7", diff: "Simple", q: "Energy of a photon?", a: "E = hν" },
  { ch: "7", diff: "Simple", q: "What is stopping potential?", a: "Negative potential to stop fastest electrons." },
  { ch: "7", diff: "Simple", q: "Relation between Kmax and stopping potential?", a: "Kmax = eV₀" },
  { ch: "7", diff: "Simple", q: "What is a matter wave?", a: "Wave associated with moving particles." },
  { ch: "7", diff: "Simple", q: "What did Hertz observe in his experiment?", a: "The spark between electrodes became more intense when ultraviolet light fell on them." },
  { ch: "7", diff: "Simple", q: "What is a photocell?", a: "A device that converts light into electric current using the photoelectric effect." },
  { ch: "7", diff: "Simple", q: "Name some photosensitive metals.", a: "Caesium, potassium, sodium and rubidium." },
  { ch: "7", diff: "Simple", q: "What is the unit of Planck's constant?", a: "J·s." },
  { ch: "7", diff: "Simple", q: "What is the value of hc in eV·Å?", a: "About 12400 eV·Å." },
  { ch: "7", diff: "Simple", q: "What is an electron-volt?", a: "The energy gained by an electron when accelerated through a potential difference of 1 V." },
  { ch: "7", diff: "Simple", q: "Who proposed the photon concept to explain the photoelectric effect?", a: "Albert Einstein." },
  { ch: "7", diff: "Simple", q: "Who experimentally verified de Broglie's hypothesis?", a: "Davisson and Germer." },
  { ch: "7", diff: "Simple", q: "What was the Davisson–Germer experiment?", a: "Diffraction of electrons from a nickel crystal, confirming the wave nature of electrons." },
  { ch: "7", diff: "Simple", q: "What are cathode rays?", a: "Streams of electrons." },
  { ch: "7", diff: "Simple", q: "What is thermionic emission?", a: "Emission of electrons from a heated metal surface." },
  { ch: "7", diff: "Simple", q: "What is field emission?", a: "Emission of electrons from a metal under a very strong electric field (about 10⁸ V/m)." },
  { ch: "7", diff: "Simple", q: "Which common metal has the lowest work function?", a: "Caesium (about 2.14 eV)." },
  { ch: "7", diff: "Simple", q: "On what does the number of photoelectrons emitted per second depend?", a: "On the intensity of the incident light." },
  { ch: "7", diff: "Simple", q: "What is cut-off potential?", a: "Another name for stopping potential." },
  { ch: "7", diff: "Simple", q: "Which graph is a straight line in the photoelectric effect?", a: "Stopping potential versus frequency." },
  { ch: "7", diff: "Simple", q: "Which photon has more energy, UV or infrared?", a: "Ultraviolet." },
  { ch: "7", diff: "Moderate", q: "Write Einstein's photoelectric equation.", a: "hν = φ₀ + Kmax" },
  { ch: "7", diff: "Moderate", q: "What is work function?", a: "Min energy to eject an electron." },
  { ch: "7", diff: "Moderate", q: "Write de Broglie wavelength formula.", a: "λ = h/p" },
  { ch: "7", diff: "Moderate", q: "How does photoelectric current depend on intensity?", a: "Directly proportional." },
  { ch: "7", diff: "Moderate", q: "How does stopping potential depend on frequency?", a: "Increases linearly." },
  { ch: "7", diff: "Moderate", q: "What is the effect of intensity on Kmax?", a: "No effect." },
  { ch: "7", diff: "Moderate", q: "What is the effect of frequency on photoelectric current?", a: "No effect (if above threshold)." },
  { ch: "7", diff: "Moderate", q: "What is the photoelectric effect?", a: "Emission of electrons by light." },
  { ch: "7", diff: "Moderate", q: "Are photoelectric emissions instantaneous?", a: "Yes (10⁻⁹ s)." },
  { ch: "7", diff: "Moderate", q: "What is the de Broglie wavelength of an electron accelerated by V?", a: "λ = 12.27/√V Å" },
  { ch: "7", diff: "Moderate", q: "What is the relation between p and K?", a: "p = √(2mK)" },
  { ch: "7", diff: "Moderate", q: "What is the photoelectric equation in terms of stopping potential?", a: "hν = φ₀ + eV₀" },
  { ch: "7", diff: "Moderate", q: "What is the threshold wavelength?", a: "λ₀ = hc/φ₀" },
  { ch: "7", diff: "Moderate", q: "What is the slope of the Kmax vs frequency graph?", a: "Planck's constant (h)." },
  { ch: "7", diff: "Moderate", q: "Find the energy of a photon of wavelength 4000 Å.", a: "E = 12400/4000 = 3.1 eV." },
  { ch: "7", diff: "Moderate", q: "Find the threshold wavelength for a metal with φ₀ = 2.5 eV.", a: "λ₀ = 12400/2.5 = 4960 Å." },
  { ch: "7", diff: "Moderate", q: "Light of wavelength 3000 Å falls on a metal with φ₀ = 2 eV. Find Kmax.", a: "4.13 − 2 = 2.13 eV." },
  { ch: "7", diff: "Moderate", q: "Find the stopping potential for the above case.", a: "2.13 V." },
  { ch: "7", diff: "Moderate", q: "Find the energy in eV of a photon of frequency 6 × 10¹⁴ Hz.", a: "hν ≈ 2.49 eV." },
  { ch: "7", diff: "Moderate", q: "How many photons per second does a 100 W source emit at 5000 Å (assuming all power is light)?", a: "N = P/E ≈ 2.5 × 10²⁰ per second." },
  { ch: "7", diff: "Moderate", q: "Find the de Broglie wavelength of an electron with 100 eV energy.", a: "λ = 12.27/√100 = 1.227 Å." },
  { ch: "7", diff: "Moderate", q: "Find the de Broglie wavelength of a 1 kg ball moving at 10 m/s.", a: "λ = h/mv = 6.6 × 10⁻³⁵ m." },
  { ch: "7", diff: "Moderate", q: "Find the ratio of de Broglie wavelengths of an electron and a proton of the same kinetic energy.", a: "λe/λp = √(mp/me) ≈ 43." },
  { ch: "7", diff: "Moderate", q: "What is the ratio of wavelengths for an electron and a proton with the same momentum?", a: "1, since λ = h/p." },
  { ch: "7", diff: "Moderate", q: "By what factor does λ change if the kinetic energy of an electron doubles?", a: "λ becomes 1/√2 times." },
  { ch: "7", diff: "Moderate", q: "What happens to photoelectric current if the source is moved twice as far?", a: "Intensity falls to one-fourth, so the current becomes one-fourth." },
  { ch: "7", diff: "Moderate", q: "Why does photoelectric current not depend on frequency above threshold?", a: "Photon arrival rate is set by intensity and each photon ejects at most one electron." },
  { ch: "7", diff: "Moderate", q: "Which metal has the higher threshold frequency?", a: "The one with the higher work function." },
  { ch: "7", diff: "Moderate", q: "What is the effect of the work function on the Kmax–ν graph?", a: "It changes the intercept (−φ₀) while the slope stays h." },
  { ch: "7", diff: "Moderate", q: "Can a free electron absorb a photon completely?", a: "No, energy and momentum cannot both be conserved." },
  { ch: "7", diff: "Moderate", q: "Stopping potential is 3 V. Find Kmax in joules.", a: "4.8 × 10⁻¹⁹ J." },
  { ch: "7", diff: "Moderate", q: "Why does an electron microscope resolve better than an optical microscope?", a: "Electron de Broglie wavelengths are much smaller than visible wavelengths." },
  { ch: "7", diff: "Moderate", q: "Find the energy of an X-ray photon of wavelength 1 Å.", a: "12.4 keV." },
  { ch: "7", diff: "Moderate", q: "State Planck's quantum hypothesis.", a: "Energy is emitted or absorbed in discrete quanta E = hν." },
  { ch: "7", diff: "Moderate", q: "What is the intensity of light in terms of photons?", a: "I = N hν, where N is the number of photons per unit area per second." },
  { ch: "7", diff: "Moderate", q: "Do photons show wave nature?", a: "Yes, with wavelength λ = h/p." },
  { ch: "7", diff: "Hard", q: "Why is wave nature not observed for macroscopic objects?", a: "Extremely small de Broglie wavelength." },
  { ch: "7", diff: "Hard", q: "What is the De Broglie wavelength of a photon?", a: "λ = hc/E" },
  { ch: "7", diff: "Hard", q: "What is the energy of a photon in eV with λ = 12400 Å?", a: "1 eV" },
  { ch: "7", diff: "Hard", q: "What is the relation between de Broglie wavelength and temperature?", a: "λ ∝ 1/√T" },
  { ch: "7", diff: "Hard", q: "What is the Compton effect?", a: "Scattering of X-rays by electrons (wavelength increases)." },
  { ch: "7", diff: "Hard", q: "What is the Compton shift formula?", a: "Δλ = (h/mc)(1 - cosθ)" },
  { ch: "7", diff: "Hard", q: "Light of 2000 Å falls on a metal with threshold wavelength 3000 Å. Find Kmax.", a: "6.2 − 4.13 = 2.07 eV." },
  { ch: "7", diff: "Hard", q: "Kmax is 1 eV for frequency ν and 3 eV for 2ν. Find the work function.", a: "hν = φ₀ + 1 and 2hν = φ₀ + 3 give hν = 2 eV and φ₀ = 1 eV." },
  { ch: "7", diff: "Hard", q: "Derive λ = h/√(2meV) for an electron accelerated through V.", a: "eV = p²/2m gives p = √(2meV) and λ = h/p." },
  { ch: "7", diff: "Hard", q: "Show that Bohr's quantisation follows from standing de Broglie waves.", a: "2πr = nλ = nh/mv gives mvr = nh/2π." },
  { ch: "7", diff: "Hard", q: "Find the momentum of a photon of wavelength 6000 Å.", a: "p = h/λ ≈ 1.1 × 10⁻²⁷ kg·m/s." },
  { ch: "7", diff: "Hard", q: "Find the force on a perfectly absorbing surface by a 1 W laser beam.", a: "F = P/c ≈ 3.3 × 10⁻⁹ N." },
  { ch: "7", diff: "Hard", q: "Why did the wave theory fail to explain the photoelectric effect?", a: "It could not explain the threshold frequency, the independence of Kmax from intensity, and the instantaneous emission." },
  { ch: "7", diff: "Hard", q: "Find the de Broglie wavelength of the electron in the first Bohr orbit.", a: "2πr₁ = λ, so λ ≈ 3.32 Å." },
  { ch: "7", diff: "Hard", q: "How do graphs differ for two intensities of the same frequency?", a: "Same stopping potential but different saturation current." },
  { ch: "7", diff: "Hard", q: "How do graphs differ for two frequencies of the same intensity?", a: "Different stopping potential, with a larger stopping potential for the higher frequency." },
  { ch: "7", diff: "Hard", q: "What is the slope of the stopping potential versus frequency graph?", a: "h/e = 4.14 × 10⁻¹⁵ V·s." },
  { ch: "7", diff: "Hard", q: "Find the energy of an electron accelerated through 1 kV.", a: "1 keV = 1.6 × 10⁻¹⁶ J." },
  { ch: "7", diff: "Hard", q: "The position of an electron is known to 1 Å. Find the minimum uncertainty in momentum.", a: "Δp ≥ h/4πΔx ≈ 5.3 × 10⁻²⁵ kg·m/s." },
  { ch: "7", diff: "Hard", q: "How many photons are in 1 J of green light of 5500 Å?", a: "N ≈ 2.8 × 10¹⁸." },
  { ch: "7", diff: "Hard", q: "What is the work function in joules for φ₀ = 4.2 eV?", a: "6.72 × 10⁻¹⁹ J." },
  { ch: "7", diff: "Hard", q: "Explain why intensity does not change Kmax.", a: "A more intense beam has more photons, not more energetic photons, and each electron absorbs only one photon." },
  { ch: "8", diff: "Simple", q: "Who discovered the nucleus?", a: "Rutherford" },
  { ch: "8", diff: "Simple", q: "Which particles are in the nucleus?", a: "Protons & Neutrons." },
  { ch: "8", diff: "Simple", q: "What are isotopes?", a: "Same Z, different A." },
  { ch: "8", diff: "Simple", q: "Source of energy in Sun?", a: "Nuclear fusion." },
  { ch: "8", diff: "Simple", q: "Who discovered radioactivity?", a: "Becquerel" },
  { ch: "8", diff: "Simple", q: "What is a beta particle?", a: "Electron/positron." },
  { ch: "8", diff: "Simple", q: "What is an alpha particle?", a: "Helium nucleus." },
  { ch: "8", diff: "Simple", q: "SI unit of radioactivity?", a: "Becquerel (Bq)." },
  { ch: "8", diff: "Simple", q: "What is nuclear fission?", a: "Splitting of heavy nucleus." },
  { ch: "8", diff: "Simple", q: "What is nuclear fusion?", a: "Combining light nuclei." },
  { ch: "8", diff: "Simple", q: "What is the charge of a gamma ray?", a: "Zero." },
  { ch: "8", diff: "Simple", q: "Who proposed the Bohr model?", a: "Niels Bohr." },
  { ch: "8", diff: "Simple", q: "What is the radius of the first Bohr orbit?", a: "0.529 Å." },
  { ch: "8", diff: "Simple", q: "What is the energy of the ground state of H?", a: "-13.6 eV." },
  { ch: "8", diff: "Simple", q: "What are isobars?", a: "Same A, different Z." },
  { ch: "8", diff: "Simple", q: "What was the Rutherford model of the atom?", a: "A tiny positive nucleus at the centre with electrons orbiting around it." },
  { ch: "8", diff: "Simple", q: "What is the approximate size of an atom?", a: "About 10⁻¹⁰ m." },
  { ch: "8", diff: "Simple", q: "What was the Thomson model?", a: "A positively charged sphere with electrons embedded in it (plum pudding)." },
  { ch: "8", diff: "Simple", q: "Why was gold foil used in Rutherford's experiment?", a: "Gold is highly malleable and can be made extremely thin." },
  { ch: "8", diff: "Simple", q: "What fraction of α-particles rebounded back in Rutherford's experiment?", a: "About 1 in 8000." },
  { ch: "8", diff: "Simple", q: "What is the distance of closest approach?", a: "The minimum distance of an α-particle from the nucleus, where all its kinetic energy has become potential energy." },
  { ch: "8", diff: "Simple", q: "What is an atomic mass unit?", a: "1/12 of the mass of a carbon-12 atom, 1.66 × 10⁻²⁷ kg." },
  { ch: "8", diff: "Simple", q: "What are nucleons?", a: "Protons and neutrons." },
  { ch: "8", diff: "Simple", q: "Who discovered the neutron?", a: "James Chadwick." },
  { ch: "8", diff: "Simple", q: "What is the mass of a neutron?", a: "1.675 × 10⁻²⁷ kg (1.0087 u)." },
  { ch: "8", diff: "Simple", q: "What is half-life?", a: "The time in which half of the radioactive nuclei decay." },
  { ch: "8", diff: "Simple", q: "What is activity?", a: "The number of decays per second." },
  { ch: "8", diff: "Simple", q: "What is 1 curie?", a: "3.7 × 10¹⁰ decays per second." },
  { ch: "8", diff: "Simple", q: "Arrange α, β, γ in order of penetrating power.", a: "γ > β > α." },
  { ch: "8", diff: "Simple", q: "Arrange α, β, γ in order of ionising power.", a: "α > β > γ." },
  { ch: "8", diff: "Simple", q: "What is beta decay?", a: "Emission of an electron (or positron) from a nucleus together with an antineutrino (or neutrino)." },
  { ch: "8", diff: "Simple", q: "What is a neutrino?", a: "A neutral, almost massless particle emitted in beta decay." },
  { ch: "8", diff: "Simple", q: "What is a chain reaction?", a: "A self-sustaining fission process in which neutrons released cause further fissions." },
  { ch: "8", diff: "Simple", q: "What is a nuclear reactor?", a: "A device in which fission occurs in a controlled manner to generate energy." },
  { ch: "8", diff: "Simple", q: "What is the ground state of an atom?", a: "The lowest energy state (n = 1)." },
  { ch: "8", diff: "Simple", q: "What is excitation energy?", a: "The energy needed to raise an electron from the ground state to a higher state." },
  { ch: "8", diff: "Simple", q: "In which region does the Pfund series lie?", a: "The far infrared." },
  { ch: "8", diff: "Moderate", q: "How does radius depend on n in Bohr model?", a: "r ∝ n²" },
  { ch: "8", diff: "Moderate", q: "What is mass defect?", a: "Δm = Zm_p + Nm_n - M." },
  { ch: "8", diff: "Moderate", q: "What is binding energy?", a: "E = Δm c²." },
  { ch: "8", diff: "Moderate", q: "Relation between half-life and decay constant?", a: "T = 0.693/λ" },
  { ch: "8", diff: "Moderate", q: "Why is energy released in fission?", a: "Higher BE/nucleon in products." },
  { ch: "8", diff: "Moderate", q: "What are nuclear forces?", a: "Strong, short-range forces." },
  { ch: "8", diff: "Moderate", q: "Bohr's quantization condition?", a: "mvr = nh/2π" },
  { ch: "8", diff: "Moderate", q: "What is a moderator?", a: "Slows down neutrons." },
  { ch: "8", diff: "Moderate", q: "Energy of nth orbit in H?", a: "En = -13.6/n² eV." },
  { ch: "8", diff: "Moderate", q: "Relation between atomic mass unit and energy?", a: "1 u = 931.5 MeV." },
  { ch: "8", diff: "Moderate", q: "What is the Rydberg formula?", a: "1/λ = R(1/n1² - 1/n2²)" },
  { ch: "8", diff: "Moderate", q: "What is the value of R?", a: "1.097 × 10⁷ m⁻¹." },
  { ch: "8", diff: "Moderate", q: "Which series is in the visible region?", a: "Balmer series." },
  { ch: "8", diff: "Moderate", q: "What is the nature of nuclear force?", a: "Attractive at short range, repulsive at very short range." },
  { ch: "8", diff: "Moderate", q: "Find the radius of a nucleus with A = 64.", a: "R = 1.2 × 64^(1/3) = 4.8 fm." },
  { ch: "8", diff: "Moderate", q: "Find the ratio of nuclear radii for A = 8 and A = 27.", a: "2 : 3." },
  { ch: "8", diff: "Moderate", q: "Find the energy of the n = 2 level of hydrogen.", a: "−3.4 eV." },
  { ch: "8", diff: "Moderate", q: "Find the radius of the second Bohr orbit of hydrogen.", a: "4 × 0.529 = 2.116 Å." },
  { ch: "8", diff: "Moderate", q: "Find the speed of the electron in the second Bohr orbit.", a: "About 1.09 × 10⁶ m/s." },
  { ch: "8", diff: "Moderate", q: "Find the wavelength of the first Paschen line.", a: "About 18750 Å." },
  { ch: "8", diff: "Moderate", q: "How many spectral lines arise from n = 4 to lower levels?", a: "n(n − 1)/2 = 6." },
  { ch: "8", diff: "Moderate", q: "The half-life is 10 days. What fraction remains after 30 days?", a: "1/8." },
  { ch: "8", diff: "Moderate", q: "Find the decay constant for a half-life of 69.3 s.", a: "0.01 s⁻¹." },
  { ch: "8", diff: "Moderate", q: "Find the mean life for a decay constant of 0.01 s⁻¹.", a: "100 s." },
  { ch: "8", diff: "Moderate", q: "A sample has 800 nuclei and half-life of 2 h. How many remain after 6 h?", a: "100." },
  { ch: "8", diff: "Moderate", q: "Find the binding energy per nucleon of ⁴He (BE = 28.3 MeV).", a: "About 7.07 MeV." },
  { ch: "8", diff: "Moderate", q: "Find the energy equivalent of 1 g of mass.", a: "9 × 10¹³ J." },
  { ch: "8", diff: "Moderate", q: "Complete: ²³⁸U emits an α-particle. Find the daughter.", a: "²³⁴Th." },
  { ch: "8", diff: "Moderate", q: "Complete the β⁻ decay of ²⁴Na.", a: "²⁴Mg." },
  { ch: "8", diff: "Moderate", q: "Write the β⁻ decay of ¹⁴C.", a: "¹⁴C → ¹⁴N + e⁻ + antineutrino." },
  { ch: "8", diff: "Moderate", q: "What is the net reaction in the Sun?", a: "4¹H → ⁴He + 2e⁺ + 2ν + 26.7 MeV." },
  { ch: "8", diff: "Moderate", q: "Why is fusion difficult on Earth?", a: "It needs temperatures of about 10⁷–10⁸ K to overcome Coulomb repulsion." },
  { ch: "8", diff: "Moderate", q: "Compare nuclear density with that of water.", a: "About 10¹⁴ times greater." },
  { ch: "8", diff: "Moderate", q: "Why are neutrons effective for causing fission?", a: "They are uncharged, so they feel no Coulomb repulsion." },
  { ch: "8", diff: "Moderate", q: "What is the multiplication factor k?", a: "The ratio of neutrons in one generation to those in the previous generation." },
